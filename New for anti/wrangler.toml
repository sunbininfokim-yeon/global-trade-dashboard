name = "global-trade-dashboard"
compatibility_date = "2024-03-01"

# Workers entry point. Without `main`, the /api/* routes in _worker.js never run
# and every API call falls through to the static asset handler (404).
main = "_worker.js"

# Static assets (index.html, app.js, data.js, style.css, public/**).
# `binding = "ASSETS"` is what _worker.js calls via env.ASSETS.fetch(request).
# See .assetsignore for files excluded from the public bundle.
[assets]
directory = "."
binding = "ASSETS"

# Bind the Cloudflare KV namespace for background data storage
[[kv_namespaces]]
binding = "AGRI_DATA_KV"
# ID from Cloudflare Dashboard (brazil_agri namespace)
id = "8f828278cb654cf4bb709f9fcf7bbe1e"

# Required secrets - set with `wrangler secret put <NAME>` or in the Cloudflare
# dashboard (Workers -> Settings -> Variables and Secrets).
# NEVER hardcode these in source; a fallback literal is itself a leak.
#   COMTRADE_API_KEY   - UN Comtrade subscription key   -> /api/comtrade
#   USDA_NASS_API_KEY  - USDA Quick Stats API key       -> /api/usda-nass
#   FRED_API_KEY       - FRED (St. Louis Fed) API key   -> /api/macro?source=fred
#   BOK_API_KEY        - Bank of Korea ECOS API key     -> /api/macro?source=bok
#   EIA_API_KEY        - US EIA API key                 -> /api/macro?source=eia
