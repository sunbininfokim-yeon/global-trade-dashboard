notes_ko: |
  나이지리아 팜유는 남동·남남부 소농 생산이 대부분이라 USDA 추정치 자체의 변동이 작고 불확실하다.
  기상 조건은 마케팅연도(10~9월) 직전 1년의 물부족량·최장 무강우·엘니뇨와 2년 전 토양수분으로 판정한다.
