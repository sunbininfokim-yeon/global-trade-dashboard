# colombia — 국가 모델 매니페스트
# 규격: ../MODEL_MANIFEST.md · 모델 코드는 ../palm_oil/ (말레이시아·태국·콜롬비아·나이지리아 공용)

country: colombia
iso: COL
label_ko: 콜롬비아
label_en: Colombia
panel_mode: forecast
model_status: training
status_note_ko: "USDA PSD 생산 추세와 USDA 추정치를 함께 보여준다. 기상 조건 판정은 참고용이고 숫자에 반영하지 않는다."
data_file: colombia_yield_forecast.json
model_name: "Colombia palm oil (USDA PSD trend + weather read-out)"

view:
  longitude: -73.5
  latitude: 5.5
  zoom: 4.8

regions:
  - key: colombia_palm_oil
    label_ko: 팜유(CPO) 생산
    ui_name: colombia_palm_oil
    coordinates: [-73.0, 4.0]
    crops_region_keys: [colombia_palm_oil]

sources:
  labels:
    name: USDA FAS PSD (Oil, Palm)
    url: https://apps.fas.usda.gov/psdonline/
    updated: "2026-10-09"
  climate:
    name: NASA POWER (daily) · NOAA OISST v2.1 Niño3.4
    url: https://power.larc.nasa.gov/
    updated: "2026-10-27"

method_refs: "Corley & Tinker (2015) The Oil Palm · Oettli et al. (2018) Sci Rep (ENSO and palm oil)"

notes_ko: |
  콜롬비아 팜유는 동부 야노스(메타·카사나레), 중부(산탄데르), 북부(막달레나·세사르) 세 권역이 대부분이다. 북부는 엘니뇨 가뭄을 탄다.
  기상 조건은 마케팅연도(10~9월) 직전 1년의 물부족량·최장 무강우·엘니뇨와 2년 전 토양수분으로 판정한다.
