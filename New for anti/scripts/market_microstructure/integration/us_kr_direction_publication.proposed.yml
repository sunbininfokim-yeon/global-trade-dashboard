# Claude Code reviews/applies this post-deployment observer.
# No public assets are changed: only archive evidence is committed.
# The existing deployment-chain guard requires this name in deploy.yml.
# A receipt-only commit therefore deploys once more, but its automatic observer
# skips because a receipt already exists. Manual dispatch permits a retry.
name: US KR direction publication observation
on:
  workflow_run:
    workflows: ['Deploy to Cloudflare Workers']
    types: [completed]
    branches: [main]
  workflow_dispatch:
concurrency:
  group: us-kr-direction-publication
  cancel-in-progress: false
jobs:
  observe:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      MM: New for anti/scripts/market_microstructure
    steps:
      # Trusted main only, never the PR head from a triggering workflow.
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Skip outside today's observation window
        id: gate
        env:
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo('Asia/Seoul'))
          target = now.strftime('%Y-%m-%d')
          path = Path('New for anti/public/data/us_kr_direction_v1.json')
          doc = json.loads(path.read_text()) if path.exists() else {}
          run = now.strftime('%H:%M') < '08:30' and doc.get('target_date') == target and doc.get('status') == 'research_preopen_forecast'
          model = json.loads(Path(os.environ['MM'], 'models/shadow/us_kr_preopen_20261022_v1.json').read_text())
          receipts = Path('data/forecasts/us_kr_direction', target, model['model_id'][:16], 'publications')
          if os.environ['MANUAL'] != 'true' and any(receipts.glob('*.json')):
              run = False
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'run={str(run).lower()}\ntarget={target}\n')
          PY
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: New for anti/scripts/market_microstructure/requirements-us-kr-preopen.txt
      - name: Install frozen runtime
        if: steps.gate.outputs.run == 'true'
        run: pip install -r "$MM/requirements-us-kr-preopen.txt"
      - name: Observe the deployed first forecast
        id: observation
        if: steps.gate.outputs.run == 'true'
        env:
          TARGET: ${{ steps.gate.outputs.target }}
        run: |
          set +e
          python "$MM/us_kr_publication.py" \
            --archive-dir data/forecasts/us_kr_direction \
            --model "$MM/models/shadow/us_kr_preopen_20261022_v1.json" \
            --target "$TARGET"
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Preserve matching or failed publication observations
        if: steps.observation.outcome == 'success' && (steps.observation.outputs.code == '0' || steps.observation.outputs.code == '2')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/forecasts/us_kr_direction
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: observe US KR forecast publication'
          bash tools/ops/git_push_retry.sh
      - name: Report unverified publication
        if: always() && steps.gate.outputs.run == 'true'
        env:
          CODE: ${{ steps.observation.outputs.code }}
        run: |
          if [ "$CODE" != '0' ]; then
            echo '::error::First forecast publication not verified before cutoff; inspect observation receipts.'
            exit 1
          fi
