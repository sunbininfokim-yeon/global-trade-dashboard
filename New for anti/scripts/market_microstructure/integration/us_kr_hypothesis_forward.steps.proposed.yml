# Add these steps after the existing outcome commit and before the final report
# in the evaluate job of us_kr_direction_forward.yml.
- name: Score shadow forecasts against the same closed prices
  id: hypothesis_score
  if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.evaluate.outcome == 'success' }}
  env:
    SHADOW_REPORT: data/observations/us_kr_hypothesis_shadow/${{ github.run_id }}-${{ github.run_attempt }}.json
  run: |
    if [ ! -s "$RUN_DIR/outcome_prices.json" ]; then
      echo "::warning::No closed-price snapshot for shadow scoring."
      exit 0
    fi
    python "$MM/us_kr_hypothesis_actions.py" evaluate \
      --model "$MM/models/shadow/us_kr_hypotheses_20261108_v1.json" \
      --outcomes "$RUN_DIR/outcome_prices.json" --output "$SHADOW_REPORT"
    echo "recorded=true" >> "$GITHUB_OUTPUT"
- name: Commit shadow evaluation
  if: ${{ !cancelled() && steps.hypothesis_score.outputs.recorded == 'true' }}
  env:
    SHADOW_REPORT: data/observations/us_kr_hypothesis_shadow/${{ github.run_id }}-${{ github.run_attempt }}.json
  run: |
    git config user.name 'github-actions[bot]'
    git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
    git add -- "$SHADOW_REPORT"
    if git diff --cached --quiet; then exit 0; fi
    git commit -m 'chore: evaluate US KR hypothesis shadow forecasts'
    bash tools/ops/git_push_retry.sh
