# COPY this file to the repo root as:
#   .github/workflows/elections_eop_monthly.yml
# Cursor/codex branches cannot land that path (ownership_guard). Claude owns
# .github/workflows/**. See HANDOFF_CLAUDE_ELECTIONS_EOP_ACTIONS.md.
name: Monthly USA EOP roster

on:
  schedule:
    # 1st of each month 10:00 UTC (19:00 KST). WHO payroll PDF is annual (July);
    # cabinet HTML can change any month.
    - cron: '0 10 1 * *'
  workflow_dispatch:

jobs:
  refresh-usa-eop:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pdfplumber

      - name: Parser tests
        working-directory: New for anti/scripts/election_watch
        run: python -m unittest discover -s tests -v

      - name: Fetch official White House pages and rebuild board
        working-directory: New for anti/scripts/election_watch
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        run: bash ci/run_usa_eop_monthly.sh

      - name: Commit extracted roster and public board
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "New for anti/scripts/election_watch/config/extracted/usa_eop.json" \
            "New for anti/scripts/election_watch/config/extracted/usa_wh_topical_advisors.json" \
            "New for anti/scripts/election_watch/config/extracted/usa_wh_office_status.json" \
            "New for anti/scripts/election_watch/config/extracted/tier12_executives.json" \
            "New for anti/scripts/election_watch/config/extracted/usa_eop_refresh_report_v1.json" \
            "New for anti/scripts/election_watch/config/extracted/usa_congress_officers.json" \
            "New for anti/public/data/elections_board_v1.json" \
            "New for anti/public/data/elections_ui_manifest_v1.json"
          git commit -m "chore: monthly USA White House / EOP roster refresh" || exit 0
          git push
