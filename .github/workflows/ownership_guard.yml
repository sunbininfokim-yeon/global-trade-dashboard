name: Ownership guard

# CODEOWNERS cannot do this job here. Every path in it resolves to the same
# single account, because all the agents commit as the repo owner, so it asks
# that owner to approve the owner and separates nothing. It also only ever sees
# a pull request -- it has no opinion about a local write, which is how a
# session's app.js was lost on 2026-08-05 and how three more edits were swept
# into another agent's commits on 2026-08-07.
#
# So ownership is enforced by branch prefix instead: a branch says who is
# driving, and each driver has files it must not touch. This runs on the PR, and
# only becomes binding once it is a required status check in branch protection.

on:
  pull_request:
    branches: [main]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changed files against branch owner
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import os, subprocess, sys, fnmatch

          branch = os.environ["HEAD_REF"]
          base, head = os.environ["BASE_SHA"], os.environ["HEAD_SHA"]

          # Files each owner may not write. The UI and deploy surface belongs to
          # Claude Code; the model pipelines belong to whoever trains them.
          # A country is added through its own manifest, never by editing app.js
          # -- that path is what keeps model work and UI work from colliding.
          UI = [
              "New for anti/app.js", "New for anti/style.css",
              "New for anti/index.html", "New for anti/data.js",
              "New for anti/shipping.js",
              "_worker.js", "wrangler.jsonc", ".github/workflows/*",
          ]
          RULES = {
              "cursor/":  UI,
              "codex/":   UI,
              "claude/":  ["scripts/yield_model/*/model.yaml"],
          }

          owner = next((p for p in RULES if branch.startswith(p)), None)
          if owner is None:
              print(f"branch '{branch}' claims no owner prefix -- skipping")
              sys.exit(0)

          changed = subprocess.run(
              ["git", "diff", "--name-only", f"{base}...{head}"],
              capture_output=True, text=True, check=True).stdout.split("\n")
          changed = [f for f in changed if f]

          bad = [f for f in changed
                 if any(fnmatch.fnmatch(f, pat) for pat in RULES[owner])]

          if not bad:
              print(f"{owner}* may write all {len(changed)} changed files")
              sys.exit(0)

          print(f"::error::'{branch}' is a {owner}* branch and must not edit these:")
          for f in bad:
              print(f"::error file={f}::{f} is not owned by {owner}* branches")
          print()
          print("Two sessions writing one file is how work gets lost here.")
          print("If this is deliberate, hand the file to its owner or rename the")
          print("branch to the prefix that owns it.")
          sys.exit(1)
          PY

      - name: Locale packs stay in sync
        run: |
          if [ -f tools/check_locales.py ]; then
            python3 tools/check_locales.py
          fi
