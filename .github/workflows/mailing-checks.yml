name: Mailing Reliability Checks
on:
  pull_request:
    paths:
      - 'services/mailing/**'
      - 'scripts/*mail*'
      - 'scripts/notify-*.js'
      - 'supabase/migrations/*mailing*.sql'
      - 'scripts/lib/policy-mailing*.cjs'
      - 'scripts/lib/policy-mac*'
      - 'scripts/lib/policy-task-lock.js'
      - 'scripts/lib/policy-quality*'
      - 'scripts/lib/commodity-digest-delivery*'
      - 'scripts/policy-mac-service.py'
      - 'scripts/install-policy-mac-service.py'
      - 'scripts/run-policy-mac-temporary.js'
      - '.github/workflows/*mail*'
      - 'New for anti/auth.js'
      - 'New for anti/mypage.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/mailing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/mailing/package-lock.json
      - run: npm ci
      - run: npm test
      - run: NODE_PATH="$PWD/node_modules" node --test ../../scripts/lib/policy-mailing-events.test.cjs ../../scripts/lib/policy-mailing-preferences.test.cjs ../../scripts/lib/policy-mailing-archive.test.cjs ../../scripts/lib/policy-mac-resume.test.cjs
      - run: node --test ../../scripts/lib/policy-mac-lock.test.cjs ../../scripts/lib/policy-quality.test.cjs ../../scripts/lib/commodity-digest-delivery.test.cjs ../../scripts/lib/policy-worker.test.js ../../scripts/lib/policy-favorites-ui.test.js ../../scripts/lib/policy-search-ui.test.js ../../scripts/lib/policy-evidence.test.js
      - run: npm run types
      - run: npm run check
      - run: npm run build
      - run: node --check '../../New for anti/auth.js' && node --check '../../New for anti/mypage.js'
