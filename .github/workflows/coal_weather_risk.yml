name: Indonesia coal rain risk

# Coal-belt rain (NASA POWER) against Indonesia's monthly coal exports
# (UN Comtrade). See New for anti/scripts/coal_weather/coal_weather.py.
# Comtrade and NASA POWER are only reachable from Actions, so on a pull
# request touching coal_weather/ it runs the same steps and commits the
# outputs to the PR branch.
on:
  schedule:
    # 6th of each month, after the month's rain is complete.
    - cron: '41 3 6 * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'New for anti/scripts/coal_weather/**'
      - '.github/workflows/coal_weather_risk.yml'

concurrency:
  group: coal-weather-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || '' }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas numpy

      - name: Offline tests
        run: python -m unittest discover -s 'New for anti/scripts/coal_weather/tests' -v

      - name: Collect Comtrade coal exports
        working-directory: "New for anti/scripts/coal_weather"
        run: python coal_weather.py labels || echo "::warning::Comtrade refresh failed; using committed labels"

      - name: Collect coal-belt rain
        working-directory: "New for anti/scripts/coal_weather"
        run: python coal_weather.py rain || echo "::warning::NASA POWER refresh failed; using committed rain"

      - name: Test and write read-out
        working-directory: "New for anti/scripts/coal_weather"
        run: python coal_weather.py analyze

      - name: Commit to the pull request branch
        if: github.event_name == 'pull_request'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "New for anti/scripts/coal_weather/data" "New for anti/public/data/coal_weather_risk_v1.json"
          git commit -m "chore: coal rain risk on the PR branch" || exit 0
          for i in 1 2 3; do
            git push origin "HEAD:$GITHUB_HEAD_REF" && exit 0
            git pull --rebase --autostash origin "$GITHUB_HEAD_REF"
          done
          git push origin "HEAD:$GITHUB_HEAD_REF"

      # Separate step with a bare `git push` so tools/ops/check_deploy_chain.py
      # sees that this workflow commits to main.
      - name: Commit and Push Changes
        if: github.event_name != 'pull_request'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "New for anti/scripts/coal_weather/data" "New for anti/public/data/coal_weather_risk_v1.json"
          git commit -m "chore: monthly coal rain risk refresh" || exit 0
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash
          done
          git push
