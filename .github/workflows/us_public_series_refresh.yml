name: Refresh public series (USA/JPN/KOR)

# 미국(us_public_series.py)·일본(jp_public_series.py)·한국(kr_public_series.py) 매크로 카드 중 fixture_synth 로 남아 있던 것을
# 공개 관측값으로 채운다. 나라마다 워크플로를 따로 두지 않고 한 번에 돌린다 -- 같은 팩 파일을 쓰고,
# 워크플로 하나가 끝날 때마다 배포가 한 번 뜨기 때문이다.
# 일본: 일본은행 시계열 API(총자산·ETF·J-REIT·콜금리·M2·기업물가·경상수지), 재무성 국채 수익률,
# 통계국 CPI CSV, FRED(GDP·외환보유액), CFTC(엔 선물 포지션). 모두 키 없음.
# 실질임금·유효구인배율은 후생노동성 엑셀인데, 최신 파일을 찾는 e-Stat 카탈로그 조회에 appId(시크릿
# ESTAT_APP_ID)가 필요하다. 읽은 값은 config/jp_estat_series_v1.json 에 남고, 시크릿이 없거나 조회가
# 안 되는 실행은 그 캐시를 읽는다 -- 그래서 키 문제로 이 두 카드가 빠지지는 않는다.
# 한국: 거의 전부 한국은행 ECOS(시크릿 ECOS_API_KEY — CPI·GDP·경상수지·외환보유액·CCSI·BSI·가계신용·M2·
# 금리·스프레드·외국인 순매수·수출)이고, 원화 환산과 금리차에 FRED 를 쓴다. 읽은 값은
# config/kr_ecos_series_v1.json 에 남고, 시크릿이 없으면 그 캐시를 읽는다(이 경우 새 달로 안 넘어간다).
# 반도체 수출만 KOSIS(과기정통부 IT산업별 월별 수출 현황; 시크릿 KOSIS_API_KEY)에서 읽는다.
# 수출 금액(export_public_series.py): 싱가포르 NODX(통계청 Table Builder)·이스라엘 상품수출(FRED). 키 없음.
#
# 미국:
# FRED CSV(키 없음)에서 가져오는 것: M2, 비농업고용, 실질 GDP(YoY·QoQ), GDPNow, 클리블랜드 절사평균 CPI,
# 수출입 물가, 재할인창구(1차 신용). FIMA 레포는 연준 H.4.1 릴리스 표1에서 직접(h41_fima.py).
# 갱신 주기가 제각각(주간·월간·분기, GDPNow 는 통계가 나올 때마다)이라 매일 한 번 돌리고,
# 값이 바뀐 날만 커밋한다(retrieved_at 은 값이 바뀔 때만 움직인다).
#
# 이 파일(macro_monitor_v1.json)은 다른 갱신기도 쓰기 때문에 push 가 겹칠 수 있다. 겹치면 내 커밋을
# 버리고 최신 main 위에서 다시 계산한다 -- 값은 네트워크에서 다시 받으니 잃는 것이 없다.

on:
  schedule:
    - cron: '40 7 * * *'
  workflow_dispatch:

jobs:
  refresh-us-public:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        working-directory: New for anti/scripts/macro_monitor
        run: pip install pytest beautifulsoup4 openpyxl xlrd
      - name: Tests
        working-directory: New for anti/scripts/macro_monitor
        run: python -m pytest tests/test_us_public_series.py tests/test_jp_public_series.py tests/test_kr_public_series.py tests/test_export_public_series.py -v
      - name: Refresh, commit, push (recompute on top of main if the push races)
        env:
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          refresh() {
            (cd "New for anti/scripts/macro_monitor" && python build_fima_repo.py; python wire_us_public_series.py; python wire_jp_public_series.py; python wire_kr_public_series.py; python wire_export_series.py) || true
          }
          for attempt in 1 2 3; do
            refresh
            git add "New for anti/scripts/macro_monitor/config/fima_repo_v1.json" \
                    "New for anti/scripts/macro_monitor/config/jp_estat_series_v1.json" \
                    "New for anti/scripts/macro_monitor/config/kr_ecos_series_v1.json" \
                    "New for anti/public/data/macro_monitor_v1.json"
            git commit -m "chore: refresh USA/JPN/KOR public series" || { echo "nothing changed"; exit 0; }
            if git push; then exit 0; fi
            echo "push raced (attempt $attempt); recomputing on the latest main"
            git fetch origin main
            git reset --hard origin/main
          done
          exit 1
