name: Monthly Russia corn/soy USDA refresh

# USDA PSD national outlook and yield history for Russian corn and soybeans
# (russia/psd_crops.py). They have no yield model -- Rosstat's crop-level
# oblast yields are not reachable -- so the panel shows USDA's outlook and
# the stage calls at four points, checked against the national yield.
# Runs after the monthly WASDE.
#
# On a pull request touching psd_crops.py it runs the same refresh plus the
# stage build and commits the outputs to the PR branch (PSD and NASA POWER
# are only reachable from Actions).
on:
  schedule:
    - cron: '50 18 14 * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'New for anti/scripts/yield_model/russia/psd_crops.py'
      - '.github/workflows/russia_psd_crops.yml'

jobs:
  refresh:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || '' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy pyyaml
      - name: Refresh USDA PSD (Russia corn/soy)
        working-directory: "New for anti/scripts/yield_model"
        run: python -m russia.psd_crops

      - name: Stage conditions on the PR branch
        if: github.event_name == 'pull_request'
        working-directory: "New for anti/scripts/yield_model"
        run: |
          python3 build_registry.py
          python -m stage_conditions.build
          git checkout -- "../../public/data/climate_registry_v1.json" 2>/dev/null || true

      - name: Commit to the pull request branch
        if: github.event_name == 'pull_request'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "New for anti/scripts/yield_model/russia/training" \
                  "New for anti/public/data/russia_yield_forecast.json" \
                  "New for anti/public/data/stage_conditions_v1.json"
          git commit -m "chore: Russia corn/soy USDA refresh on the PR branch" || exit 0
          git push origin "HEAD:$GITHUB_HEAD_REF"

      # A separate step with a bare `git push`, so tools/ops/check_deploy_chain.py
      # sees that this workflow commits to main and deploy.yml must chain it.
      - name: Commit and Push Changes
        if: github.event_name != 'pull_request'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "New for anti/scripts/yield_model/russia/training" \
                  "New for anti/public/data/russia_yield_forecast.json"
          git commit -m "chore: monthly Russia corn/soy USDA refresh" || exit 0
          for i in 1 2 3; do
            git push && exit 0
            echo "push rejected, rebasing onto latest main and retrying ($i/3)"
            git pull --rebase --autostash
          done
          git push
