name: tmp ua probe
on:
  push:
    branches: [claude/tmp-ua-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - run: |
          B="https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data"
          for t in apro_cpshr apro_cpnhr; do
            curl -s -m 120 "$B/$t?format=JSON&lang=EN&geo=FRB0&geo=FR&geo=DE&geo=FRE2" -o /tmp/$t.json || true
            python3 -c "
          import json;d=json.load(open('/tmp/$t.json'));print('$t', d.get('label'), d['id'], d['size'], 'values', len(d.get('value',{})))
          for dim in d['id']:
              c=d['dimension'][dim]['category']; print(' ',dim, list(c.get('label',{}).items())[:25])
          " >> probe/es2.txt 2>&1 || echo "$t fail $(head -c 300 /tmp/$t.json)" >> probe/es2.txt
          done
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add probe; git commit -qm "probe2"; git push
