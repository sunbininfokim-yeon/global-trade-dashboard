name: tmp ua probe
on:
  push:
    branches: [claude/tmp-ua-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe/z
          curl -sL -m 60 -A "Mozilla/5.0" https://stat.gov.ua/en/development-api/step-by-step-example -o probe/step.html || true
          grep -oE 'https?://[^"<> ]*(sdmx|SDMX|rest|api)[^"<> ]*' probe/step.html | sed 's/&amp;/\&/g' | sort -u > probe/sdmx_urls.txt || true
          cat probe/sdmx_urls.txt
          u=$(grep -iE 'dataflow' probe/sdmx_urls.txt | head -1)
          echo "dataflow url: $u"
          [ -n "$u" ] && curl -sL -m 120 -H "Accept: application/json" "$u" -o probe/dataflows.json || true
          python3 - <<'PY2' > probe/dataflows.txt 2>&1 || true
          import json,re
          s=open("probe/dataflows.json",encoding="utf-8",errors="replace").read()
          print(len(s)); print(s[:600])
          try:
              d=json.loads(s); flows=d.get("data",{}).get("dataflows",[]) or d.get("Dataflows",[])
              for f in flows:
                  n=json.dumps(f.get("names",f.get("name","")),ensure_ascii=False)
                  if re.search(r"(?i)crop|harvest|yield|agri|урож|рослин|сільськ|зібран|культур", n+f.get("id","")): print(f.get("agencyID"), f.get("id"), f.get("version"), n[:200])
          except Exception as e: print("ERR",e)
          PY2
          curl -sL -m 180 -A "Mozilla/5.0" -o probe/z/rosl.zip "https://stat.gov.ua/sites/default/files/2023-08/%D0%A0%D0%BE%D1%81%D0%BB%D0%B8%D0%BD%D0%BD%D0%B8%D1%86%D1%82%D0%B2%D0%BE%20%281991-2022%29.zip" || true
          python3 -c "
          import zipfile
          z=zipfile.ZipFile('probe/z/rosl.zip')
          for i in z.infolist():
              n=i.filename
              try: n=n.encode('cp437').decode('utf-8')
              except Exception: pass
              print(i.file_size, n)
          " > probe/rosl_list.txt 2>&1 || true
          rm -f probe/z/*.zip
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add probe; git commit -qm "probe2"; git push
