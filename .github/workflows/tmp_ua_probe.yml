name: tmp ua probe
on:
  push:
    branches: [claude/tmp-ua-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe
          curl -sL -m 60 https://zenodo.org/api/records/17279151 -o probe/zenodo.json || true
          python3 -c "
          import json;d=json.load(open('probe/zenodo.json'))
          print(d['metadata']['title'], d['metadata'].get('version'))
          for f in d['files']: print(f['key'], f['size'], f['links']['self'])
          " | tee probe/zenodo_files.txt
          for y in 2015 2019 2020 2021 2022 2023 2024; do
            for p in "operativ/operativ${y}/sg/sg_reg/scr_reg/scr_e/scr0715_e.html" "operativ/operativ${y}/sg/sg_reg/scr_reg/scr_e/scr0615_e.html"; do
              code=$(curl -sL -m 60 -A "Mozilla/5.0" -o "probe/ukr_${y}_$(basename $p)" -w "%{http_code}" "https://ukrstat.gov.ua/$p"); echo "$y $p $code $(wc -c < probe/ukr_${y}_$(basename $p))"
            done
          done | tee probe/ukrstat.txt
          curl -s -m 60 "https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/apro_cpshr?format=JSON&lang=EN&crops=C1110&strucpro=YI_HU_EU&geo=FR&time=2023" | head -c 1500 > probe/eurostat.txt; echo >> probe/eurostat.txt
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add probe; git commit -qm "probe"; git push
