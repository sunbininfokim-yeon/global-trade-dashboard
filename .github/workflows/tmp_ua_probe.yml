name: tmp ua probe
on:
  push:
    branches: [claude/tmp-ua-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe
          for slug in datasets/areas-gross-harvests-and-crop-yield-annual datasets/areas-gross-harvests-and-productivity-agricultural-crops; do
            f=probe/$(basename $slug).html
            curl -sL -m 60 -A "Mozilla/5.0" "https://stat.gov.ua/en/$slug" -o $f || true
            echo "== $slug $(wc -c < $f)"; grep -oE 'href="[^"]+\.(xlsx|xls|csv|zip|json|xml)[^"]*"|href="[^"]*(sdmx|download|api)[^"]*"' $f | sort -u | head -60
          done > probe/statgov.txt 2>&1 || true
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add probe; git commit -qm "probe2"; git push
