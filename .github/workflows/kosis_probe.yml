name: KOSIS probe

# 일회성 탐색용. KOSIS 통계표 ID·분류/항목 이름을 실제 응답으로 확인해 kosis_kr.py 를 채우기 위한 것이라
# 스케줄이 없고 아무것도 커밋하지 않는다. 키는 환경변수로만 읽고 출력하지 않는다.
# 코드가 확정되면 이 파일은 지운다.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe KOSIS
        working-directory: New for anti/scripts/macro_monitor
        env:
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
        run: python kosis_probe.py
