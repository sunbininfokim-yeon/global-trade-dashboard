name: Refresh peer real GDP growth (World Bank, annual)

# gdp_yoy was fixture_synth/demo for all 19 monitor countries, USA included.
# IMF WEO's only real-GDP-growth series (NGDP_RPCH) has no actual/forecast
# flag and runs years into projections -- fine for sovereign_fiscal.py's
# debt/interest, which gets a real cutoff for free by intersecting against
# a shorter-running companion series, but GDP growth has no such companion.
# The World Bank's NY.GDP.MKTP.KD.ZG only ever publishes years it has
# actually measured (confirmed 2026-09-24: no 2026 row exists for any
# country yet), so there is no equivalent "projected" row to accidentally
# graft as if it were an actual.
#
# refresh_peer_gdp_in_pack.py grafts onto the already-built
# macro_monitor_v1.json -- graft-not-rebuild, same shape as the other
# *_in_pack.py refreshers. Taiwan has no World Bank country record (not a
# bug) and is skipped, restoring nothing.

on:
  schedule:
    # Weekly: this is annual-resolution data (one print per country per
    # year), so daily/weekly both mean "usually a no-op" -- weekly avoids
    # spending a run every day checking a series that moves once a year.
    - cron: '30 18 * * 3'
  workflow_dispatch:

jobs:
  refresh-peer-gdp:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test deps
        working-directory: New for anti/scripts/macro_monitor
        run: pip install pytest
      - name: Tests
        working-directory: New for anti/scripts/macro_monitor
        run: python -m pytest tests/test_peer_gdp.py -v
      - name: Fetch World Bank GDP growth snapshot
        working-directory: New for anti/scripts/macro_monitor
        run: python build_peer_gdp_snapshot.py
      - name: Graft into macro_monitor_v1.json
        working-directory: New for anti/scripts/macro_monitor
        run: python refresh_peer_gdp_in_pack.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "New for anti/scripts/macro_monitor/config/peer_gdp_v1.json" \
                  "New for anti/public/data/macro_monitor_v1.json"
          git commit -m "chore: refresh peer real GDP growth (World Bank)" || exit 0
          git push
