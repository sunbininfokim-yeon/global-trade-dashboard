name: Monthly USA EOP roster

# Copied from New for anti/scripts/election_watch/ci/elections_eop_monthly.yml
# (cursor/elections-usa-eop-monthly, PR #288) -- Cursor's branch can't land
# .github/workflows/** under ownership_guard, so Claude installs it verbatim
# here except for one addition: the push-retry-with-rebase loop that
# market_microstructure_daily.yml and us_superpac_refresh.yml already use,
# because those two hit a real non-fast-forward failure on 2026-08-28 when
# another scheduled bot committed to main in the same window. This job's own
# commit step had a plain `git push` with no retry, so a same-day collision
# with the ticker or superpac refresh would have failed it outright.

on:
  schedule:
    # 1st of each month 10:00 UTC (19:00 KST). WHO payroll PDF is annual (July);
    # cabinet HTML can change any month.
    - cron: '0 10 1 * *'
  workflow_dispatch:

jobs:
  refresh-usa-eop:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: elections-eop-monthly
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pdfplumber

      - name: Parser tests
        working-directory: New for anti/scripts/election_watch
        run: python -m unittest discover -s tests -v

      - name: Fetch official White House pages and rebuild board
        working-directory: New for anti/scripts/election_watch
        run: bash ci/run_usa_eop_monthly.sh

      - name: Commit extracted roster and public board
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "New for anti/scripts/election_watch/config/extracted/usa_eop.json" \
            "New for anti/scripts/election_watch/config/extracted/tier12_executives.json" \
            "New for anti/scripts/election_watch/config/extracted/usa_eop_refresh_report_v1.json" \
            "New for anti/public/data/elections_board_v1.json" \
            "New for anti/public/data/elections_ui_manifest_v1.json"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: monthly USA White House / EOP roster refresh"
          for i in 1 2 3; do
            git push && exit 0
            echo "push rejected, rebasing onto latest main and retrying ($i/3)"
            git pull --rebase --autostash origin main
          done
          git push
