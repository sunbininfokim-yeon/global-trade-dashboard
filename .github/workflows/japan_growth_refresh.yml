name: Refresh Japan growth diagnostics

# capex_gdp_ratio / net_funding_demand / gdp_gap were grafted into
# macro_monitor_v1.json once, by hand, from a snapshot Codex built on
# 2026-08-20. Nothing kept them current after that -- the underlying ESRI
# (Cabinet Office) and BOJ releases move quarterly, and a value frozen at
# "official_snapshot" with no refresh path is a snapshot forever, not the
# live-official reading the badge implies.
#
# build_japan_growth_snapshot.py already hits the real ESRI/BOJ endpoints
# (no key needed) and reproduces the same numbers on every run --
# refresh_japan_growth_in_pack.py then re-derives just those three
# indicators inside the existing pack via the engine's own attach function,
# without rebuilding macro_monitor_v1.json from scratch (which would drop
# the CPI/PCE/Fed-balance-sheet/QE-QT work layered on top of it since).

on:
  schedule:
    # Sat 02:56 KST (Fri 17:56 UTC) — weekend batch, 22min after climate.
    # Macro/growth diagnostics (GDP-side), not a commodity feed -- grouped
    # here only because it shares the weekly cadence and weekend slot.
    # Source releases are quarterly; weekly is generous headroom, not a
    # rate this needs.
    - cron: '56 17 * * 5'
  workflow_dispatch:

jobs:
  refresh-japan-growth:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        working-directory: New for anti/scripts/macro_monitor
        # openpyxl parses the ESRI Cabinet Office Excel release
        # (macro_monitor/japan_growth.py) -- missing here since this
        # workflow's first version, so every run since 2026-08-24 failed at
        # test collection (ModuleNotFoundError) before ever reaching the
        # actual refresh steps.
        run: pip install pytest openpyxl
      - name: Tests
        working-directory: New for anti/scripts/macro_monitor
        run: python -m pytest tests/test_japan_growth.py -v
      - name: Refresh ESRI/BOJ snapshot
        working-directory: New for anti/scripts/macro_monitor
        run: python build_japan_growth_snapshot.py
      - name: Graft into macro_monitor_v1.json
        working-directory: New for anti/scripts/macro_monitor
        run: python refresh_japan_growth_in_pack.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "New for anti/scripts/macro_monitor/config/japan_growth_v1.json" \
                  "New for anti/public/data/macro_monitor_v1.json"
          git commit -m "chore: refresh Japan growth diagnostics (ESRI/BOJ)" || exit 0
          # Non-fast-forward race: a bare push drops this refresh when another
          # scheduled job lands a commit on main first. Rebase and retry.
          for i in 1 2 3; do
            git push && exit 0
            echo "push rejected, rebasing onto latest main and retrying ($i/3)"
            git pull --rebase --autostash
          done
          git push
