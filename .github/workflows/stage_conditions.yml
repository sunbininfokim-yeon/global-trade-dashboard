name: Stage weather conditions

# Favourable / unfavourable / neutral weather per growth stage for every
# region in crop_stages_v1.json (stage_conditions/build.py). Weather only,
# so it does not wait on the forecast runs. Twice a week keeps a running
# stage current.
on:
  schedule:
    # Mon and Fri 19:32 UTC -- after the Friday forecast batch.
    - cron: '32 19 * * 1,5'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Test
        working-directory: "New for anti/scripts/yield_model"
        run: python -m unittest stage_conditions.test_build

      - name: Build stage conditions
        # No API keys: NASA POWER is open.
        working-directory: "New for anti/scripts/yield_model"
        run: python -m stage_conditions.build

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "New for anti/public/data/stage_conditions_v1.json"
          git commit -m "chore: refresh stage weather conditions" || exit 0
          for i in 1 2 3; do
            git push && exit 0
            echo "push rejected, rebasing onto latest main and retrying ($i/3)"
            git pull --rebase --autostash
          done
          git push
