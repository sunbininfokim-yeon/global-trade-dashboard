name: Weekly Biomass Trade Refresh

# Wood pellet (HS 4401.31) imports into Korea and Japan by supplier, and the
# main exporters' totals, from the UN Comtrade public preview API
# (scripts/yield_model/biomass/pellet_trade.py). Comtrade is only reachable
# from Actions, so a pull request that touches biomass/ runs the same steps
# and commits the outputs to its branch.
on:
  schedule:
    # Fri 16:47 UTC, ahead of the palm oil run (17:23) that refreshes PKS.
    - cron: '47 16 * * 5'
  workflow_dispatch:
  pull_request:
    paths:
      - 'New for anti/scripts/yield_model/biomass/**'
      - '.github/workflows/biomass_trade.yml'

jobs:
  refresh:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || '' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pytest

      - name: Offline tests
        working-directory: "New for anti/scripts/yield_model"
        run: python -m pytest biomass -q

      - name: Refresh pellet trade (UN Comtrade)
        # Public preview API, no key, rate limited; a failure keeps the committed files.
        working-directory: "New for anti/scripts/yield_model"
        run: python -m biomass.pellet_trade || echo "::warning::Comtrade pellet refresh failed; using committed files"

      - name: Commit to the pull request branch
        if: github.event_name == 'pull_request'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          for f in "New for anti/scripts/yield_model/biomass/training" \
                   "New for anti/public/data/pellet_trade_v1.json"; do
            [ -e "$f" ] && git add "$f"
          done
          git commit -m "chore: pellet trade on the PR branch" || exit 0
          for i in 1 2 3; do
            git push origin "HEAD:$GITHUB_HEAD_REF" && exit 0
            echo "push rejected, rebasing and retrying ($i/3)"
            git pull --rebase --autostash origin "$GITHUB_HEAD_REF"
          done
          git push origin "HEAD:$GITHUB_HEAD_REF"

      # A separate step with a bare `git push`, so tools/ops/check_deploy_chain.py
      # sees that this workflow commits to main and deploy.yml must chain it.
      - name: Commit and Push Changes
        if: github.event_name != 'pull_request'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          for f in "New for anti/scripts/yield_model/biomass/training" \
                   "New for anti/public/data/pellet_trade_v1.json"; do
            [ -e "$f" ] && git add "$f"
          done
          git commit -m "chore: weekly pellet trade refresh" || exit 0
          for i in 1 2 3; do
            git push && exit 0
            echo "push rejected, rebasing onto latest main and retrying ($i/3)"
            git pull --rebase --autostash
          done
          git push
