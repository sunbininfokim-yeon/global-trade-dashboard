name: Russia NDVI (MODIS, weekly)

# In-season crop-condition channel for the Russian yield models, the same
# MODIS MOD13Q1 collection as argentina_ndvi.yml (keyless ORNL DAAC API).
on:
  schedule:
    # Thu 14:40 UTC -- before the Russia forecast and 40 min ahead of the
    # Argentina NDVI job so the two do not hit ORNL at once.
    - cron: '40 14 * * 4'
  # TEMP backfill trigger for the feature branch; removed before merge.
  push:
    branches: ['claude/russia-ndvi']
    paths: ['.github/workflows/russia_ndvi.yml']
  workflow_dispatch:
    inputs:
      full:
        description: 'Rebuild the whole record from 2000'
        type: boolean
        default: false

jobs:
  ndvi:
    runs-on: ubuntu-latest
    timeout-minutes: 230
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy scikit-learn

      - name: Collect NDVI
        # Incremental: only composites missing from condition/ndvi_points.csv
        # are requested. The first run backfills 2000 onward (~2,400 calls).
        working-directory: "New for anti/scripts/yield_model"
        run: python -m russia.ndvi ${{ inputs.full && '--full' || '' }}

      - name: Re-score the NDVI correction
        # A scoring failure must not cost the week's collection.
        continue-on-error: true
        # Decides per region which windows the live forecast may correct with
        # NDVI, against whatever models are on main this week.
        working-directory: "New for anti/scripts/yield_model"
        run: python -m russia.ndvi_backtest

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "New for anti/scripts/yield_model/russia/condition"
          git commit -m "chore: Russia MODIS NDVI refresh" || exit 0
          for i in 1 2 3; do
            git push && exit 0
            echo "push rejected, rebasing and retrying ($i/3)"
            git pull --rebase --autostash
          done
          git push
