name: Weekly China Yield Forecast

on:
  schedule:
    # Sat 01:50 KST (Fri 16:50 UTC) — weekend batch, 22min after India so the
    # country jobs do not race for the same commit. NASA POWER lags real time
    # by 2-3 days, so a weekly cadence always picks up new observations.
    - cron: '50 16 * * 5'
  workflow_dispatch:

jobs:
  forecast:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy scikit-learn

      - name: Run forecast
        # No API keys. USDA PSD and FAOSTAT bulk CSVs, NASA POWER and NOAA CPC
        # are open; UN Comtrade goes through this project's own Worker proxy,
        # which holds the subscription key server-side.
        #
        # Three of the six models decline to forecast for part of the year --
        # Northeast soy and corn need September-October frost data, South China
        # the late-September cold-dew window. That is intended behaviour, not a
        # failure, and they report "season has no observed weather yet".
        working-directory: "New for anti/scripts/yield_model"
        run: |
          python -m china.run_forecast

      # PSD revises monthly and rolls the marketing year forward once a season.
      # When a new season lands the training tables and models have to be
      # rebuilt, or the pipeline keeps forecasting against a record that
      # stopped growing.
      - name: Rebuild models if USDA published a new season
        working-directory: "New for anti/scripts/yield_model"
        run: |
          set -e
          LATEST_TRAINED=$(python -c "import pandas as pd; d=pd.read_csv('china/training/henan_wheat.csv').dropna(subset=['target']); print(int(d.year.max()))")
          LATEST_PUBLISHED=$(python -c "
          import os, china.labels as L
          for f in ('psd_grains_china.csv', 'psd_oilseeds_china.csv'):
              p = os.path.join(L.CACHE, f)
              if os.path.exists(p):
                  os.remove(p)
          print(int(L.psd_yield_kg_ha('Wheat').year.max()))
          ")
          echo "trained through $LATEST_TRAINED, USDA published through $LATEST_PUBLISHED"
          if [ "$LATEST_PUBLISHED" -gt "$LATEST_TRAINED" ]; then
            echo "new season published -- rebuilding training tables and models"
            python -m china.collect
            python -m china.train
            python -m china.imports
            python -m china.run_forecast
          else
            echo "no new season; keeping existing models"
          fi

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "New for anti/public/data/china_yield_forecast.json" \
                  "New for anti/scripts/yield_model/china/training" \
                  "New for anti/scripts/yield_model/china/models"
          git commit -m "chore: weekly China regional yield forecast refresh" || exit 0
          # Non-fast-forward race: a bare push drops this refresh when another
          # scheduled job lands a commit on main first. Rebase and retry.
          for i in 1 2 3; do
            git push && exit 0
            echo "push rejected, rebasing onto latest main and retrying ($i/3)"
            git pull --rebase --autostash
          done
          git push
