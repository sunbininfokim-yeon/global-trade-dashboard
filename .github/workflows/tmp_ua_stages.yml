name: tmp ukraine stages
on:
  push:
    branches: [claude/ukraine-stages]
    paths: [".github/workflows/tmp_ua_stages.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas numpy
      - working-directory: "New for anti/scripts/yield_model"
        run: |
          python3 build_registry.py
          python -m stage_conditions.build
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "New for anti/public/data/stage_conditions_v1.json"
          git commit -m "chore: refresh stage weather conditions" || exit 0
          git push
