name: Indonesia palm PSD experiment (temporary)
# Branch-only; removed before the PR. Bump to re-run: 1
on:
  push:
    branches: [claude/indonesia-palm]
    paths: ['.github/workflows/indonesia_palm_probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy
      - name: Fetch and evaluate
        working-directory: "New for anti/scripts/yield_model"
        run: |
          python -m indonesia.palm_psd fetch
          python -m indonesia.palm_psd evaluate 2>&1 | tee indonesia/training/palm_psd_experiment.log
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "New for anti/scripts/yield_model/indonesia/training"
          git commit -m "chore: Indonesia palm PSD experiment" || exit 0
          git push
