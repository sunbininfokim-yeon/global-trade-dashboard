name: SST ERDDAP probe (temporary)
on:
  push:
    branches: [claude/project-thread-0ekrkm]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for base in https://coastwatch.noaa.gov/erddap https://www.ncei.noaa.gov/erddap https://apdrc.soest.hawaii.edu/erddap https://pae-paha.pacioos.hawaii.edu/erddap https://erddap.aoml.noaa.gov/hdb/erddap https://polarwatch.noaa.gov/erddap https://oceanwatch.pifsc.noaa.gov/erddap; do
            echo "=== $base"
            curl -s --max-time 60 -A global-trade-dashboard "$base/search/advanced.csv?searchFor=oisst&protocol=griddap&page=1&itemsPerPage=30" | cut -d, -f1-16 | grep -i -E 'oisst|Dataset ID' | awk -F, '{print $NF" | "$0}' | cut -c1-260 | head -15
          done
          echo "=== PSL THREDDS"
          curl -s -o /dev/null -w '%{http_code}\n' --max-time 60 "https://psl.noaa.gov/thredds/dodsC/Datasets/noaa.oisst.v2.highres/sst.day.anom.2026.nc.dds"
          curl -s --max-time 60 "https://psl.noaa.gov/thredds/dodsC/Datasets/noaa.oisst.v2.highres/sst.day.anom.2026.nc.dds" | head -12
