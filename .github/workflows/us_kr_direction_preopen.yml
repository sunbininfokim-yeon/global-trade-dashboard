name: US KR direction preopen

# KOSPI·삼성전자·SK하이닉스 next-session direction (#868 frozen model): runs
# after the US close and must finish before 08:30 KST on the target day, when
# the runner stops accepting a forecast as pre-open.
#
# GitHub's own schedule is not enough for that window. market_microstructure
# _daily's 06:13 KST cron has landed at 09:24-11:53 KST (2026-10-27..11-04),
# i.e. after the cutoff every time. The on-time trigger is the Cloudflare
# Worker cron (wrangler.jsonc, 21:25 and 22:05 UTC every day), which calls
# workflow_dispatch with GH_DISPATCH_TOKEN (a GitHub Actions secret that
# deploy.yml copies to the Worker). The schedule below is a fallback only.
#
# Target = the next KRX session on or after today (KST). On a weekday that is
# today; on a weekend or KR holiday it is the next session, so Saturday 06:25,
# right after the US Friday close, already publishes Monday's forecast (user
# request 2026-11-08: show the next session's value as soon as its inputs
# exist). Later runs for the same target skip once a forecast exists; an
# unavailable result (e.g. 15007 not uploaded yet) is retried by the next run.
#
# Daily job calls predict only -- never train. Model changes need a new
# artifact path in a reviewed PR.

on:
  schedule:
    # 06:25 KST every day = 21:25 UTC.
    - cron: '25 21 * * *'
    # Separate GitHub fallback slots while Cloudflare dispatch is unavailable.
    - cron: '43 21 * * *'
    - cron: '17 22 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: Korean target session YYYY-MM-DD; blank means the next session on or after today (KST)
        required: false
        type: string
      dispatch_check:
        description: Diagnose the Worker token without collecting or publishing
        required: false
        type: choice
        options:
          - ''
          - check
          - receipt

concurrency:
  group: us-kr-direction-preopen-${{ inputs.dispatch_check || 'forecast' }}
  cancel-in-progress: false

jobs:
  dispatch_check:
    if: github.ref == 'refs/heads/main' && inputs.dispatch_check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: {}
    steps:
      - name: Check the token used by the Worker
        if: inputs.dispatch_check == 'check'
        env:
          GH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::GH_DISPATCH_TOKEN is missing"
            exit 1
          fi
          printf '%s' '{"ref":"main","inputs":{"dispatch_check":"receipt"}}' | \
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/us_kr_direction_preopen.yml/dispatches" --input -
          echo 'GitHub accepted the dispatch using the Worker token.'
      - name: Confirm receipt
        if: inputs.dispatch_check == 'receipt'
        run: echo 'Worker token dispatch received. No forecast was run.'

  preopen:
    if: ${{ !inputs.dispatch_check }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      MM: New for anti/scripts/market_microstructure
      PUBLIC_OUT: New for anti/public/data/us_kr_direction_v1.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: New for anti/scripts/market_microstructure/requirements-us-kr-preopen.txt

      - name: Install frozen runtime
        run: pip install -r "$MM/requirements-us-kr-preopen.txt"

      - name: Resolve target session and skip what would not be a pre-open forecast
        id: gate
        working-directory: New for anti/scripts/market_microstructure
        env:
          REQUESTED_TARGET: ${{ inputs.target }}
          PUBLIC_JSON: ${{ github.workspace }}/New for anti/public/data/us_kr_direction_v1.json
        run: python "$GITHUB_WORKSPACE/tools/ops/preopen_target.py"

      - name: Check frozen inference and recording contract
        if: steps.gate.outputs.valid == 'true'
        run: |
          python -m unittest discover -s "$MM/tests" -p test_us_kr_direction_engine.py
          python -m unittest discover -s "$MM/tests" -p test_run_us_kr_preopen.py
          python -m unittest discover -s "$MM/tests" -p test_us_kr_forward.py
          python -m unittest discover -s "$MM/tests" -p test_us_kr_publication.py
          python -m unittest discover -s tools/ops/tests -p test_preopen_target.py

      # Same private hive and token as market_microstructure_daily. A failed
      # checkout (expired token) leaves the runner with the committed board
      # only, which it reports as missing source-day input -- never a stale fill.
      - name: Checkout KRX 15007 raw exports
        id: krx
        if: steps.gate.outputs.valid == 'true'
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: sunbininfokim-yeon/krx-month-paste
          token: ${{ secrets.GH_DISPATCH_TOKEN }}  # same GitHub PAT that starts the pre-open run; reads krx-month-paste
          path: krx-month-paste
          # 12009 = per-stock investor flow, read by the foreign_stock_flow factor (#961).
          sparse-checkout: |
            data/raw/krx_15007
            data/normalized/krx_12009_stock_investor
          sparse-checkout-cone-mode: false

      - name: Collect and infer; never train
        id: forecast
        if: steps.gate.outputs.valid == 'true'
        env:
          TARGET: ${{ steps.gate.outputs.target }}
        run: |
          set +e
          python "$MM/run_us_kr_preopen.py" \
            --target "$TARGET" \
            --model "$MM/models/shadow/us_kr_preopen_20261022_v1.json" \
            --krx-root krx-month-paste/data/raw/krx_15007 \
            --stock-flow-root krx-month-paste/data/normalized/krx_12009_stock_investor \
            --refresh-prices \
            --run-dir "runner-state/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --archive-dir data/forecasts/us_kr_direction \
            --public-output "$PUBLIC_OUT"
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Save run receipts and input snapshot
        if: always() && steps.gate.outputs.valid == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: us-kr-direction-${{ github.run_id }}-${{ github.run_attempt }}
          path: runner-state/
          retention-days: 30

      # 0 = pre-open forecast, 2 = unavailable. Both publish: the card must
      # say 자료 없음 for today rather than keep yesterday's numbers.
      # Gate on the step having run: a skipped step's output is null, and
      # null == '0' is true in Actions expressions (both coerce to 0), so the
      # bare comparison ran this step on a skipped day and failed (2026-11-06).
      - name: Commit forecast data
        if: steps.forecast.outcome == 'success' && (steps.forecast.outputs.code == '0' || steps.forecast.outputs.code == '2')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$PUBLIC_OUT"
          if [ -d data/forecasts/us_kr_direction ]; then git add data/forecasts/us_kr_direction; fi
          if git diff --cached --quiet; then echo 'nothing changed'; exit 0; fi
          git commit -m "chore: record US KR preopen direction ${{ steps.gate.outputs.target }}"
          bash tools/ops/git_push_retry.sh

      - name: Report outcome
        if: always() && steps.gate.outputs.valid == 'true'
        env:
          CODE: ${{ steps.forecast.outputs.code }}
          KRX_CHECKOUT: ${{ steps.krx.outcome }}
          TARGET: ${{ steps.gate.outputs.target }}
        run: |
          if [ "$KRX_CHECKOUT" != 'success' ]; then
            echo "::warning::krx-month-paste checkout failed ($KRX_CHECKOUT) -- GH_DISPATCH_TOKEN may be missing krx-month-paste access or have expired."
          fi
          case "$CODE" in
            0) echo "### $TARGET pre-open forecast published" >> "$GITHUB_STEP_SUMMARY" ;;
            2) echo "::warning::$TARGET forecast unavailable -- the card shows 자료 없음. Reasons are in the run receipts artifact."
               echo "### $TARGET unavailable (see artifact run_report.json)" >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "::error::runner crashed (exit '$CODE')"; exit 1 ;;
          esac

  # Research-only shadow forecasts (#955, Codex): KOSPI and Samsung candidates
  # with paired baselines, stored under data/forecasts/us_kr_hypothesis_shadow.
  # Independent of the preopen job above: it neither reads nor changes the
  # public card, and it retries on its own if the home forecast already exists.
  hypothesis_shadow:
    if: github.ref == 'refs/heads/main' && !inputs.dispatch_check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      MM: New for anti/scripts/market_microstructure
      SHADOW_ARCHIVE: data/forecasts/us_kr_hypothesis_shadow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: New for anti/scripts/market_microstructure/requirements-us-kr-preopen.txt
      - name: Install frozen runtime
        run: pip install -r "$MM/requirements-us-kr-preopen.txt"
      - name: Check shadow recording contract
        run: python -m unittest discover -s "$MM/tests" -p test_us_kr_hypothesis_shadow.py
      - name: Resolve independent shadow target
        id: shadow_plan
        env:
          REQUESTED_TARGET: ${{ inputs.target }}
        run: |
          python "$MM/us_kr_hypothesis_actions.py" plan \
            --model "$MM/models/shadow/us_kr_hypotheses_20261108_v1.json" \
            --archive "$SHADOW_ARCHIVE" --target "${REQUESTED_TARGET:-}"
      - name: Checkout Samsung KRX 12009
        if: steps.shadow_plan.outputs.run == 'true'
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: sunbininfokim-yeon/krx-month-paste
          token: ${{ secrets.GH_DISPATCH_TOKEN }}
          path: krx-month-paste
          sparse-checkout: data/normalized/krx_12009_stock_investor
          persist-credentials: false
      - name: Record shadow forecasts
        if: steps.shadow_plan.outputs.run == 'true'
        env:
          TARGET: ${{ steps.shadow_plan.outputs.target }}
        run: |
          mkdir -p runner-state/hypothesis-shadow
          code=0
          python "$MM/us_kr_hypothesis_shadow.py" predict --target "$TARGET" \
            --model "$MM/models/shadow/us_kr_hypotheses_20261108_v1.json" \
            --live --flow-root krx-month-paste/data/normalized/krx_12009_stock_investor \
            --archive "$SHADOW_ARCHIVE" \
            > runner-state/hypothesis-shadow/receipt.json || code=$?
          if [ "$code" -eq 2 ]; then
            echo "::warning::$TARGET shadow inputs unavailable; see the receipt."
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi
      - name: Save shadow receipt
        if: ${{ !cancelled() && steps.shadow_plan.outputs.run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: us-kr-hypothesis-preopen-${{ github.run_id }}-${{ github.run_attempt }}
          path: runner-state/hypothesis-shadow/receipt.json
          retention-days: 30
      - name: Commit new shadow records
        if: steps.shadow_plan.outputs.run == 'true'
        run: |
          if [ ! -d "$SHADOW_ARCHIVE" ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$SHADOW_ARCHIVE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: record US KR hypothesis shadow forecasts'
          bash tools/ops/git_push_retry.sh
