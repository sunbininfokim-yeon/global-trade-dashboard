name: Market microstructure daily

# Conc append + US→KR L3 + US OI / derivatives board.
# Cloudflare cron은 Worker HTTP 워밍업용이라 Python 배치에는 부적합 → Actions.
# KRX_API는 repo secret(선택). 없으면 KR OI/외인 자동은 missing, US·Conc는 진행.

on:
  schedule:
    # 16:30 KST (07:30 UTC) weekdays — after KRX cash close; US OI = delayed prior/current.
    - cron: '30 7 * * 1-5'
  workflow_dispatch:

jobs:
  daily:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: New for anti/scripts/market_microstructure
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: New for anti/scripts/market_microstructure/requirements-ci.txt

      - name: Install deps
        run: pip install -r requirements-ci.txt

      - name: Conc history append
        run: |
          python build_conc_history.py --append-only --print-stats || \
            python build_conc_history.py --live --months 6 --print-stats

      - name: D&S + LETF share + FreeSIS credit/deposit
        env:
          KRX_API: ${{ secrets.KRX_API }}
        run: |
          python build_market_microstructure.py --live --source auto --print-stats
          python build_letf_share_history.py --append-only
          python build_deposit_credit.py --print-stats

      - name: US→KR L3
        run: python build_us_kr_l3.py --live --print-stats

      - name: Derivatives board + US OI archive
        env:
          KRX_API: ${{ secrets.KRX_API }}
        run: python build_derivatives_board.py --live --print-stats

      - name: Investor × price levels (real data; marcap + high-vol in top100)
        run: python build_investor_price_levels.py --live --universe both --top 10 --pool 100 --print-stats

      - name: Commit snapshots
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "New for anti/public/data/kospi_concentration_history_v1.json" \
            "New for anti/public/data/market_microstructure_v1.json" \
            "New for anti/public/data/market_microstructure_history_v1.json" \
            "New for anti/public/data/deposit_credit_v1.json" \
            "New for anti/public/data/us_microstructure_v1.json" \
            "New for anti/public/data/us_regime_v1.json" \
            "New for anti/public/data/us_kr_transmission_v1.json" \
            "New for anti/public/data/us_kr_discovered_edges_v1.json" \
            "New for anti/public/data/us_kr_open30m_backtest_v1.json" \
            "New for anti/public/data/us_kr_hitrate_v1.json" \
            "New for anti/public/data/us_kr_regime_proxy_backtest_v1.json" \
            "New for anti/public/data/derivatives_board_v1.json" \
            "New for anti/public/data/kr_foreign_derivatives_history_v1.json" \
            "New for anti/public/data/us_oi_daily_archive.jsonl" \
            "New for anti/public/data/investor_price_levels_v1.json" \
            "New for anti/scripts/market_microstructure/US_KR_L3.md" \
            "New for anti/scripts/market_microstructure/DERIVATIVES_BOARD.md" \
            "New for anti/scripts/market_microstructure/INVESTOR_PRICE_LEVELS.md" \
            "New for anti/scripts/market_microstructure/tests/fixtures/us_day.json" \
            || true
          git commit -m "chore: refresh market microstructure daily snapshots" || exit 0
          git push
