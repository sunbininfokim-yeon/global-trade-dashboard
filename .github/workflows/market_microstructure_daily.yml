name: Market microstructure daily

# Conc append + US→KR L3 + US OI / derivatives board.
# Cloudflare cron은 Worker HTTP 워밍업용이라 Python 배치에는 부적합 → Actions.
# KRX_API는 repo secret(선택). 없으면 KR OI/외인 자동은 missing, US·Conc는 진행.

on:
  schedule:
    # 06:13 KST next day (21:13 UTC same weekday) — NOT same-evening.
    # Confirmed empirically 2026-08-27: even 9.5h after KRX cash close
    # (16:08 UTC / 01:08 KST next day), KRX's stk_bydd_trd still had no
    # same-day basDd and fell back a day. Running before the next KST
    # trading session opens (~14.5h after close) gives KRX's own EOD
    # publish process much more margin. Mon-Fri (UTC) => Tue-Sat (KST)
    # delivery mornings, each carrying the prior UTC weekday's close.
    - cron: '13 21 * * 1-5'
  workflow_dispatch:

jobs:
  daily:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: New for anti/scripts/market_microstructure
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: New for anti/scripts/market_microstructure/requirements-ci.txt

      - name: Install deps
        run: pip install -r requirements-ci.txt

      - name: Conc history append
        run: |
          python build_conc_history.py --append-only --print-stats || \
            python build_conc_history.py --live --months 6 --print-stats

      - name: US→KR L3
        run: python build_us_kr_l3.py --live --print-stats

      - name: Market microstructure snapshot
        env:
          KRX_API: ${{ secrets.KRX_API }}
        run: python build_market_microstructure.py --live --source auto --print-stats

      - name: Append external ETF snapshot history
        run: python append_external_history.py --print-stats

      - name: Derivatives board + US OI archive
        env:
          KRX_API: ${{ secrets.KRX_API }}
        run: python build_derivatives_board.py --live --print-stats

      - name: Append derivatives and LETF history
        run: python append_derivatives_history.py --print-stats

      - name: Investor × price levels (real data; marcap + high-vol in top100)
        run: python build_investor_price_levels.py --live --universe both --top 10 --pool 100 --print-stats

      - name: Deposit · credit overlay
        run: python publish_deposit_credit.py

      - name: Alert levels
        run: python build_alert_levels.py --live

      - name: Validate UI data contract
        run: python validate_ui_contracts.py

      - name: Commit snapshots
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "New for anti/public/data/kospi_concentration_history_v1.json" \
            "New for anti/public/data/us_microstructure_v1.json" \
            "New for anti/public/data/us_regime_v1.json" \
            "New for anti/public/data/us_kr_transmission_v1.json" \
            "New for anti/public/data/us_kr_discovered_edges_v1.json" \
            "New for anti/public/data/us_kr_open30m_backtest_v1.json" \
            "New for anti/public/data/us_kr_hitrate_v1.json" \
            "New for anti/public/data/us_kr_regime_proxy_backtest_v1.json" \
            "New for anti/public/data/derivatives_board_v1.json" \
            "New for anti/public/data/us_oi_daily_archive.jsonl" \
            "New for anti/public/data/market_microstructure_v1.json" \
            "New for anti/public/data/ai_casino_brief_v1.json" \
            "New for anti/public/data/external_venues_v1.json" \
            "New for anti/public/data/external_leverage_history_v1.jsonl" \
            "New for anti/public/data/deposit_credit_v1.json" \
            "New for anti/public/data/alert_levels_v1.json" \
            "New for anti/public/data/derivatives_activity_history_v1.jsonl" \
            "New for anti/public/data/leverage_direction_history_v1.jsonl" \
            "New for anti/public/data/stock_letf_history_v1.jsonl" \
            "New for anti/public/data/investor_price_levels_v1.json" \
            "New for anti/scripts/market_microstructure/US_KR_L3.md" \
            "New for anti/scripts/market_microstructure/DERIVATIVES_BOARD.md" \
            "New for anti/scripts/market_microstructure/TABLES.md" \
            "New for anti/scripts/market_microstructure/AI_CASINO_BRIEF.md" \
            "New for anti/scripts/market_microstructure/ALERT_LEVELS.md" \
            "New for anti/scripts/market_microstructure/INVESTOR_PRICE_LEVELS.md" \
            "New for anti/scripts/market_microstructure/tests/fixtures/us_day.json"
          git commit -m "chore: refresh market microstructure daily snapshots" || exit 0
          # A bare push loses the whole day's snapshot if any other scheduled
          # job lands a commit on main in between (observed 2026-08-28: build
          # succeeded, push rejected as non-fast-forward, no retry -- the run
          # just failed and the data stayed stale until the next day's cron).
          for i in 1 2 3; do
            git push && exit 0
            echo "push rejected, rebasing onto latest main and retrying ($i/3)"
            git pull --rebase --autostash
          done
          git push
