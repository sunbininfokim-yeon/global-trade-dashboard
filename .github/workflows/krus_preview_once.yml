# TEMPORARY (removed before merge): one real run (2) of the KR→US publisher on this branch.
name: KR US preview (temporary)
on:
  push:
    branches: [claude/trusting-franklin-i9fizt]
    paths: [.github/workflows/krus_preview_once.yml]
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MM: New for anti/scripts/market_microstructure
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r "$MM/requirements-us-kr-preopen.txt"
      - run: python -m unittest discover -s "$MM/tests" -p test_publish_kr_us_semiconductor.py
      - working-directory: New for anti/scripts/market_microstructure
        run: python publish_kr_us_semiconductor.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "New for anti/public/data/kr_us_semiconductor_v1.json" "New for anti/public/data/kr_us_semiconductor_history_v1.json"
          git commit -m "data: KR to US semiconductor history (preview run)" || exit 0
          git push
