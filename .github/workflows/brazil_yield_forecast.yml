name: Weekly Brazil Yield Forecast

on:
  schedule:
    # Sat 00:44 KST (Fri 15:44 UTC) — weekend batch, 22min after the US run
    # so the two do not race for the same commit. NASA POWER lags real time
    # by 2-3 days, so a weekly cadence always picks up genuinely new
    # observations.
    - cron: '44 15 * * 5'
  workflow_dispatch:

jobs:
  forecast:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy scikit-learn

      - name: Run forecast
        # No API keys: IBGE SIDRA, NASA POWER and NOAA CPC are all open.
        working-directory: "New for anti/scripts/yield_model"
        run: |
          python -m brazil.run_forecast

      # IBGE publishes PAM once a year. When a new season lands, the training
      # tables and models have to be rebuilt or the pipeline keeps forecasting
      # against a record that stopped growing. Cheap to detect, so check every
      # run rather than relying on someone remembering in September.
      - name: Rebuild models if IBGE published a new season
        working-directory: "New for anti/scripts/yield_model"
        run: |
          set -e
          LATEST_TRAINED=$(python -c "import pandas as pd; d=pd.read_csv('brazil/training/parana_soja.csv').dropna(subset=['yield_kg_ha']); print(int(d.year.max()))")
          LATEST_PUBLISHED=$(python -c "
          import brazil.sidra as s
          print(int(s.state_yield('soja','PR').year.max()))
          ")
          echo "trained through $LATEST_TRAINED, IBGE published through $LATEST_PUBLISHED"
          if [ "$LATEST_PUBLISHED" -gt "$LATEST_TRAINED" ]; then
            echo "new season published -- rebuilding training tables and models"
            python -m brazil.collect
            python -m brazil.train
            python -m brazil.run_forecast
          else
            echo "no new season; keeping existing models"
          fi

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "New for anti/public/data/brazil_yield_forecast.json" \
                  "New for anti/scripts/yield_model/brazil/training" \
                  "New for anti/scripts/yield_model/brazil/models"
          git commit -m "chore: weekly Brazil regional yield forecast refresh" || exit 0
          git push
