name: Weekly Brazil Yield Forecast

on:
  schedule:
    # Mondays 09:30 UTC, half an hour after the US run so the two do not
    # race for the same commit. NASA POWER lags real time by 2-3 days, so a
    # weekly cadence always picks up genuinely new observations.
    - cron: '30 9 * * 1'
  workflow_dispatch:

jobs:
  forecast:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy scikit-learn

      - name: Run forecast
        # No API keys: IBGE SIDRA, NASA POWER and NOAA CPC are all open.
        working-directory: "New for anti/scripts/yield_model"
        run: |
          python -m brazil.run_forecast

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "New for anti/public/data/brazil_yield_forecast.json"
          git commit -m "chore: weekly Brazil regional yield forecast refresh" || exit 0
          git push
