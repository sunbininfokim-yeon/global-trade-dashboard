name: Sync Indonesia Policy Data
on:
  schedule:
    - cron: '43 */4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: indonesia-policy-sync
  cancel-in-progress: false
jobs:
  sync:
    # 운영 DB 키를 쓰는 job: main 에서만 돈다. 브랜치에서 수동 실행하면 건너뛴다
    # (2026-10-22 브랜치 수집이 운영 메일 대기열을 만든 사고 후속).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Reviewed regional collector from PR #703; UI deployment remains independent.
      - uses: actions/checkout@v4
        with:
          ref: 572756c39ae5425a8f7d812246a19be1b224acdd
          path: collector
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned collector dependencies
        run: python -m pip install -r collector/scripts/indonesia_policy/requirements.txt
      - name: Collect official documents into Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONUNBUFFERED: '1'
        run: python tools/idn_sync/run_cloud.py --collector collector --state-dir "${RUNNER_TEMP}/idn-state"
