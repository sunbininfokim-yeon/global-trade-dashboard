name: Refresh FOMC/Beige Book collection

# The FOMC/Beige Book panel (mmUsPolicyQuality in macro.js) was ported from
# Codex as a frozen 2026-08-12 snapshot -- real documents, but nothing ever
# re-fetched them. build_fomc_collect.py now hits federalreserve.gov
# directly (statement pages + Beige Book National Summary, both public
# HTML, no key) and build_us_macro_quality_from_collect.py reassembles the
# document the panel reads. build_fomc_statement_diff.py adds a word-level
# redline against the previous meeting's statement. All three are
# idempotent -- only meetings/editions not already collected get fetched --
# so this is a small diff after each real FOMC meeting, not a full re-scrape.

on:
  schedule:
    # Daily rather than weekly: GitHub Actions cron can't read
    # fomc_calendar_v1.json to fire only the day after a real decision date,
    # and a fixed weekly slot meant up to a 6-day lag after a meeting. Daily
    # costs nothing extra -- every run but the one right after a meeting is
    # a no-op (idempotent skip) -- and gets the site to "day after the
    # decision" instead.
    - cron: '2 19 * * *'
  workflow_dispatch:

jobs:
  refresh-fomc:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        working-directory: New for anti/scripts/macro_monitor
        run: pip install pytest beautifulsoup4
      - name: Tests
        working-directory: New for anti/scripts/macro_monitor
        run: python -m pytest tests/test_fomc_collect.py tests/test_fomc_statement_diff.py -v
      - name: Collect statements + Beige Book
        working-directory: New for anti/scripts/macro_monitor
        # A meeting the parser flags (a compound/qualified dissent it can't
        # categorize) makes this exit 1 -- caught here rather than failing
        # the job, since a genuinely new edge case in one meeting shouldn't
        # block every other meeting's data from refreshing on schedule.
        # It still shows up in the job log for a human to look at.
        run: python build_fomc_collect.py || true
      - name: Assemble us_macro_quality_v1.json
        working-directory: New for anti/scripts/macro_monitor
        run: python build_us_macro_quality_from_collect.py
      - name: Build statement wording diff
        working-directory: New for anti/scripts/macro_monitor
        run: python build_fomc_statement_diff.py || true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "New for anti/scripts/macro_monitor/config/fomc_meetings_v1.json" \
                  "New for anti/scripts/macro_monitor/config/beige_book_v1.json" \
                  "New for anti/scripts/macro_monitor/config/fomc_statement_text_v1.json" \
                  "New for anti/public/data/us_macro_quality_v1.json" \
                  "New for anti/public/data/fomc_statement_diff_v1.json"
          git commit -m "chore: refresh FOMC/Beige Book collection" || exit 0
          # Non-fast-forward race: a bare push drops this refresh when another
          # scheduled job lands a commit on main first. Rebase and retry.
          for i in 1 2 3; do
            git push && exit 0
            echo "push rejected, rebasing onto latest main and retrying ($i/3)"
            git pull --rebase --autostash
          done
          git push
