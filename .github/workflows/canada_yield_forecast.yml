name: Monthly Canada Yield Forecast

on:
  schedule:
    # Monthly on the 1st at 11:00 UTC (20:00 KST). Aligns with AAFC's monthly
    # Outlook cadence; POWER weather still refreshes for in-season diagnostics.
    - cron: '0 11 1 * *'
  workflow_dispatch:

jobs:
  forecast:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy scikit-learn

      - name: Refresh POWER + labels, then forecast + gov outlooks
        working-directory: "New for anti/scripts/yield_model"
        run: |
          set -e
          # Collect refreshes NASA POWER / ONI / StatsCan caches when needed.
          python -m canada.collect
          # Retrain only when a new labelled season appears in any SAD track.
          NEED_TRAIN=0
          for f in canada/training/sad_*.csv; do
            [ -f "$f" ] || continue
            TRAINED=$(python -c "import pandas as pd; d=pd.read_csv('$f').dropna(subset=['yield_kg_ha']); print(int(d.year.max()) if len(d) else 0)")
            KEY=$(basename "$f" .csv)
            MODEL="canada/models/${KEY}.json"
            if [ ! -f "$MODEL" ]; then
              NEED_TRAIN=1
              echo "missing model for $KEY"
              break
            fi
          done
          # Always retrain if any SAD training max year exceeds model season stamp
          # stored loosely via file mtime comparison against newest training year
          # vs previous forecast season — cheap heuristic for annual StatCan drops.
          if [ "$NEED_TRAIN" = "1" ]; then
            python -m canada.train
          else
            echo "models present; skipping full retrain (monthly forecast-only)"
          fi
          python -m canada.run_forecast

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "New for anti/public/data/canada_yield_forecast.json" \
                  "New for anti/public/data/canada_gov_outlooks.json" \
                  "New for anti/scripts/yield_model/canada/training" \
                  "New for anti/scripts/yield_model/canada/models"
          git commit -m "chore: monthly Canada yield forecast + gov outlook refresh" || exit 0
          git push
