name: India labels rebuild (temporary)

# Branch-only: refresh the India Data Portal extract, rebuild training
# tables and models, commit them back for review. Removed before merge.
on:
  push:
    branches: ['claude/india-labels']
    paths: ['.github/workflows/india_labels_probe.yml']

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy scipy scikit-learn
      - working-directory: "New for anti/scripts/yield_model"
        run: |
          set -e
          python -m india.idp
          python -m india.collect
          python -m india.train 2>&1 | tee /tmp/train.log
          python -m india.run_forecast
          mkdir -p india/_rebuild_log && cp /tmp/train.log india/_rebuild_log/train.log
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "New for anti/scripts/yield_model/india/data/idp_apy.csv" "New for anti/scripts/yield_model/india/training" \
                  "New for anti/scripts/yield_model/india/models" "New for anti/scripts/yield_model/india/_rebuild_log" \
                  "New for anti/public/data/india_yield_forecast.json"
          git commit -m "chore: rebuild India models with labels through 2024" && git push
