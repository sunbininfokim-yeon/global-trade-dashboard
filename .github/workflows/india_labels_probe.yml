name: India labels pull (temporary)

# Branch-only: run india.idp in Actions (the container cannot reach India
# Data Portal) and commit data/idp_apy.csv back for review. Removed before
# merge.
on:
  push:
    branches: ['claude/india-labels']
    paths: ['.github/workflows/india_labels_probe.yml', 'New for anti/scripts/yield_model/india/idp.py']

jobs:
  pull:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas
      - working-directory: "New for anti/scripts/yield_model"
        run: python -m india.idp
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "New for anti/scripts/yield_model/india/data/idp_apy.csv"
          git commit -m "chore: India Data Portal APY extract" && git push
