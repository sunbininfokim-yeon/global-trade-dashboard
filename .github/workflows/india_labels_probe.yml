name: Labels source probe (temporary)

# Pulls the agriculture section of tochno.st's Rosstat "Regions of Russia"
# collection (v20260313) and commits a filtered extract to this branch, so
# its coverage can be checked. Branch-only; removed before merge.
on:
  push:
    branches: ['claude/india-labels']
    paths: ['.github/workflows/india_labels_probe.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and filter
        run: |
          set -e
          mkdir -p /tmp/t && cd /tmp/t
          curl -sSL -m 600 -o s13.zip "https://storage.yandexcloud.net/tochno-st-catalog/Rosstat/data_regions_collection_102_v20260313/data_13_socio_economic_102_v20260313.zip"
          ls -la; unzip -o -q s13.zip -d s13; find s13 -type f | head -50 > files.txt; cat files.txt
          pip install -q pandas pyarrow
          python3 - <<'PY'
          import glob, os, pandas as pd
          out = "/tmp/t/extract"
          os.makedirs(out, exist_ok=True)
          files = glob.glob("/tmp/t/s13/**/*", recursive=True)
          frames = []
          for f in files:
              if f.endswith(".parquet"):
                  frames.append(pd.read_parquet(f))
              elif f.endswith(".csv"):
                  try:
                      frames.append(pd.read_csv(f, sep=";", low_memory=False))
                  except Exception as e:
                      print("skip", f, e)
          d = pd.concat(frames, ignore_index=True)
          print(d.columns.tolist()); print(d.head(3).to_string())
          d.head(200).to_csv(f"{out}/head.csv", index=False)
          s = d.astype(str)
          mask = s.apply(lambda c: c.str.contains("13120000|13160000|13050000|рожайн|осевн", regex=True)).any(axis=1)
          d[mask].to_csv(f"{out}/agri_filtered.csv", index=False)
          print("filtered rows", int(mask.sum()))
          PY
          cp /tmp/t/files.txt /tmp/t/extract/
          dest="$GITHUB_WORKSPACE/New for anti/scripts/yield_model/russia/training/_tochno_probe"
          mkdir -p "$dest"; cp /tmp/t/extract/* "$dest/"
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "New for anti/scripts/yield_model/russia/training/_tochno_probe"
          git commit -m "probe: tochno.st section 13 extract" && git push
