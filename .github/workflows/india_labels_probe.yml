name: Labels source probe (temporary)

# Which post-2021 Russian and post-2019 Indian crop-yield sources answer
# from Actions without a login. Branch-only; removed before merge.
on:
  push:
    branches: ['claude/india-labels']
    paths: ['.github/workflows/india_labels_probe.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          probe() {
            code=$(curl -sSL -A "Mozilla/5.0" -o /tmp/out -w '%{http_code} %{content_type} %{size_download}' -m 60 "$1" || echo fail)
            echo "::notice::$code | $1 | $(head -c 200 /tmp/out | tr -d '\n\r' | tr -c '[:print:]' ' ')"
          }
          probe "https://github.com/tochno-st/regions_collection"
          probe "https://api.github.com/repos/tochno-st/regions_collection/contents"
          probe "https://tochno.st/datasets/regions_collection"
          probe "https://statbase.ru/datasets/?q=%D1%83%D1%80%D0%BE%D0%B6%D0%B0%D0%B9%D0%BD%D0%BE%D1%81%D1%82%D1%8C"
          probe "https://www.mojgorod.ru/r_stat/index.html"
          curl -sSL -A "Mozilla/5.0" -m 60 https://www.mojgorod.ru/ | grep -oiE 'href="[^"]*r_stat[^"]*"' | head -20 | tr '\n' ' ' | sed 's/^/::notice::mojgorod links /'; echo
          curl -sSL -m 60 "https://ckan.indiadataportal.com/api/3/action/package_show?id=area-production-yield-apy" \
            | python3 -c "import json,sys; r=json.load(sys.stdin)['result']; [print('::notice::IDP res', x.get('name'), x.get('format'), x.get('size'), x.get('last_modified'), x.get('url')) for x in r['resources'][:6]]"
