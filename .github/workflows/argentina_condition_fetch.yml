name: Argentina crop condition (source probe)

# Probes which in-season crop-condition sources are reachable from Actions.
# BCBA's history files sit behind a Cloudflare challenge, so candidates are
# public APIs that need no browser.
on:
  push:
    branches: ['claude/argentina-condition']
    paths: ['.github/workflows/argentina_condition_fetch.yml']
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe sources
        run: |
          probe() {
            code=$(curl -sS -A "Mozilla/5.0" -o /tmp/out -w '%{http_code} %{content_type} %{size_download}' -m 60 "$1" || echo fail)
            echo "::notice::$code | $1 | $(head -c 160 /tmp/out | tr -d '\n\r' | tr -c '[:print:]' ' ')"
          }
          # MODIS NDVI subsets (ORNL DAAC), a Pampas point near Pergamino
          probe "https://modis.ornl.gov/rst/api/v1/MOD13Q1/dates?latitude=-33.9&longitude=-60.6"
          probe "https://modis.ornl.gov/rst/api/v1/MOD13Q1/subset?latitude=-33.9&longitude=-60.6&band=250m_16_days_NDVI&startDate=A2024001&endDate=A2024032&kmAboveBelow=0&kmLeftRight=0"
          # Bolsa de Comercio de Rosario
          probe "https://www.bcr.com.ar/es/mercados/gea/estimaciones-nacionales-de-produccion/estimaciones"
          # MAGyP open data (labels already come from here)
          probe "https://datos.magyp.gob.ar/api/3/action/package_show?id=estimaciones-agricolas"
          # BCBA again, for the record
          probe "https://www.bolsadecereales.com/download/informes/documento2/123"
