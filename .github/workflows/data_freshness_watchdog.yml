name: Data freshness watchdog

# Scheduled workflows are best-effort on GitHub's shared runners and can be
# delayed or silently skipped entirely (observed: market_microstructure_daily
# skipped outright on 2026-08-27). This job doesn't run the pipelines --
# it only checks whether their published output is older than expected and
# fails loudly (GitHub's default failed-run email) when it is, so a missed
# run gets noticed the same day instead of only when someone looks at stale
# data on the dashboard.

on:
  schedule:
    # Every 4h at :09 (off :00/:15/:30/:45) so this check itself doesn't add
    # to the queue congestion it exists to catch.
    - cron: '9 */4 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check monitored data files are fresh
        run: |
          python3 - <<'PY'
          import subprocess
          import sys
          from datetime import datetime, timedelta, timezone

          now_utc = datetime.now(timezone.utc)
          GRACE_H = 4
          RUNTIME_BUFFER_H = 1  # allowance for the job itself to finish + commit

          # (path, cron hour UTC, cron minute UTC, allowed cron weekdays
          #  (Mon=0..Sun=6) -- must match the producing workflow's own
          #  schedule exactly, since freshness is judged against "when was
          #  this job last supposed to fire", not a fixed day-of-week guess.
          CHECKS = [
              # market_microstructure_daily.yml: '13 21 * * 1-5' (Mon-Fri UTC)
              ("New for anti/public/data/market_microstructure_v1.json",
               21, 13, (0, 1, 2, 3, 4)),
              # shipping_capacity_update.yml: '37 18 * * *' (every day)
              ("New for anti/public/data/shipping_capacity_v1.json",
               18, 37, tuple(range(7))),
              # sst_refresh.yml: '18 18 * * 5' (Fri UTC). The region series
              # sat untouched for weeks once because nothing ran it.
              ("New for anti/public/data/sst_regions_v1.json",
               18, 18, (4,)),
          ]

          def last_expected_fire(hour, minute, weekdays):
              day = now_utc.replace(hour=hour, minute=minute, second=0, microsecond=0)
              if day > now_utc:
                  day -= timedelta(days=1)
              for _ in range(10):
                  if day.weekday() in weekdays:
                      return day
                  day -= timedelta(days=1)
              raise RuntimeError("could not find a last expected fire in 10 days")

          def last_commit_time(path):
              out = subprocess.run(
                  ["git", "log", "-1", "--format=%ct", "--", path],
                  capture_output=True, text=True, check=True,
              ).stdout.strip()
              if not out:
                  return None
              return datetime.fromtimestamp(int(out), tz=timezone.utc)

          failures = []
          for path, hour, minute, weekdays in CHECKS:
              last_fire = last_expected_fire(hour, minute, weekdays)
              deadline = last_fire + timedelta(hours=RUNTIME_BUFFER_H + GRACE_H)
              if now_utc < deadline:
                  continue  # still inside the grace window for the latest expected run
              commit_time = last_commit_time(path)
              if commit_time is None:
                  failures.append(f"{path}: no commit history found")
              elif commit_time < last_fire:
                  age_h = (now_utc - commit_time).total_seconds() / 3600
                  failures.append(
                      f"{path}: last commit {commit_time.isoformat()} predates "
                      f"the expected run at {last_fire.isoformat()} ({age_h:.1f}h old)"
                  )

          if failures:
              print("::error::Data freshness watchdog found stale files:")
              for f in failures:
                  print(f"::error::{f}")
              sys.exit(1)

          print("All monitored data files are fresh.")
          PY
