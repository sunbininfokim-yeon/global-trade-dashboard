name: Thailand NDVI backfill (temporary)
# Branch-only: backfills thailand/condition/ndvi_points.csv and scores it.
# Removed before the PR. Bump this to re-run: 1
on:
  push:
    branches: [claude/thailand-ndvi]
    paths: ['.github/workflows/thailand_ndvi_probe.yml']
jobs:
  ndvi:
    runs-on: ubuntu-latest
    timeout-minutes: 230
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy scipy scikit-learn
      - name: Collect NDVI
        working-directory: "New for anti/scripts/yield_model"
        run: python -m thailand.ndvi
      - name: Backtest
        working-directory: "New for anti/scripts/yield_model"
        run: python -m thailand.ndvi_backtest || true
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "New for anti/scripts/yield_model/thailand/condition"
          git commit -m "chore: Thailand MODIS NDVI backfill" || exit 0
          git push
