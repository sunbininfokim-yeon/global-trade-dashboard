name: US election polls daily

on:
  schedule:
    - cron: '10 21 * * *' # Daily 06:10 KST; includes post-election health/results refresh
  workflow_dispatch:
  pull_request:
    paths:
      - 'New for anti/scripts/election_watch/**/*poll*'
      - 'New for anti/scripts/election_watch/election_watch/seat_scenarios.py'
      - 'New for anti/scripts/election_watch/config/usa_polls/**'
      - '.github/workflows/us_election_polls_refresh.yml'
      - 'New for anti/js/elections/**'

permissions:
  contents: read

concurrency:
  group: us-election-polls-refresh
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate polling contracts without network
        working-directory: New for anti/scripts/election_watch
        run: python3 -m unittest discover -s tests -p 'test*poll*.py' -v

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate polling UI contracts when present
        run: |
          if [ -d 'New for anti/js/elections/tests' ]; then
            node --experimental-default-type=module --test 'New for anti/js/elections/tests/'*.test.mjs
          fi

  refresh:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh selected polls and reviewed official results
        id: collect
        continue-on-error: true
        run: python3 'New for anti/scripts/election_watch/refresh_live_polls.py'
      - name: Retain reviewable output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-election-polls
          path: |
            New for anti/public/data/usa_election_live_polls*.json
            New for anti/public/data/usa_election_poll_history_2026.json
            New for anti/public/data/usa_midterms_forecast_v1.json
      - name: Publish data and source health
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'New for anti/public/data/usa_election_live_polls_v1.json' 'New for anti/public/data/usa_election_live_polls_status_v1.json' 'New for anti/public/data/usa_election_poll_history_2026.json'
          if [ -f 'New for anti/public/data/usa_midterms_forecast_v1.json' ]; then
            git add -- 'New for anti/public/data/usa_midterms_forecast_v1.json'
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: refresh US election polls and source health'
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          git push origin HEAD:main
      - name: Report collection failure after preserving last good data
        if: steps.collect.outcome == 'failure'
        run: exit 1
