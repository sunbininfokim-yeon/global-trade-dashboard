name: Market microstructure backfill

# One-off historical backfill, run by hand. The daily job only ever appends
# today; this walks a date range of KRX EOD and fills the gaps behind it.
#
# Safe to re-run: append_jsonl dedupes on (date) or (date, ticker), so a range
# that overlaps existing rows replaces those keys rather than duplicating them.
# A date KRX has no data for (holiday, or a transient API failure) is skipped
# and leaves no row -- nothing is interpolated or seeded.
#
# Single-stock LETF cannot go back past 2026-05-27: that is the KRX listing
# date of the Hynix/Samsung single-stock leveraged ETFs, so no earlier
# observation exists to fetch.

on:
  workflow_dispatch:
    inputs:
      start:
        description: 'Start date, inclusive (YYYY-MM-DD). Single-stock LETF has nothing before 2026-05-27.'
        required: true
        default: '2026-05-27'
      end:
        description: 'End date, inclusive (YYYY-MM-DD)'
        required: true
      target:
        description: 'Which log(s) to backfill'
        required: true
        type: choice
        default: 'both'
        options: ['both', 'single_stock_letf', 'market_activity']
      dry_run:
        description: 'List what would be written without writing or committing'
        required: true
        type: boolean
        default: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: New for anti/scripts/market_microstructure
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: New for anti/scripts/market_microstructure/requirements-ci.txt

      - name: Install deps
        run: pip install -r requirements-ci.txt

      - name: Single-stock LETF backfill
        if: inputs.target == 'both' || inputs.target == 'single_stock_letf'
        env:
          KRX_API: ${{ secrets.KRX_API }}
        run: |
          python backfill_single_stock_letf_history.py \
            --start "${{ inputs.start }}" --end "${{ inputs.end }}" \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Market activity + direction backfill
        if: inputs.target == 'both' || inputs.target == 'market_activity'
        env:
          KRX_API: ${{ secrets.KRX_API }}
        run: |
          python backfill_market_activity_history.py \
            --start "${{ inputs.start }}" --end "${{ inputs.end }}" \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Validate UI data contract
        if: ${{ !inputs.dry_run }}
        run: python validate_ui_contracts.py

      - name: Commit backfilled history
        if: ${{ !inputs.dry_run }}
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "New for anti/public/data/stock_letf_history_v1.jsonl" \
            "New for anti/public/data/derivatives_activity_history_v1.jsonl" \
            "New for anti/public/data/leverage_direction_history_v1.jsonl"
          git commit -m "chore: backfill market microstructure history ${{ inputs.start }}..${{ inputs.end }}" || exit 0
          git pull --rebase origin main
          git push
