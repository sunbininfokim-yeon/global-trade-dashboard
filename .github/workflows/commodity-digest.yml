name: Commodity Mailing Archive Recovery

# Replays saved metadata idempotently. Scheduled sending belongs exclusively to
# the mailing Worker, so a delayed GitHub runner cannot delay the morning mail.
on:
  schedule:
    - cron: '15 21 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: commodity-mailing-archive
  cancel-in-progress: false
jobs:
  archive-and-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MAIL_SEND_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/notify-commodity-digest.js
