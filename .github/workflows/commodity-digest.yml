name: Weekly Commodity Favorites Digest

# Reads whatever New for anti/public/data/commodity_reports_v1.json already
# holds (commodity_reports.yml refreshes that every 4h) -- this workflow
# does no fetching of its own, just checks out the latest commit and mails
# favorited-commodity subscribers what they haven't seen yet.

on:
  schedule:
    # Monday 08:00 KST (UTC+9) = Sunday 23:00 UTC.
    - cron: '0 23 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Read Supabase and print what would be sent; send and record nothing"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate script
        run: node --check scripts/notify-commodity-digest.js

      # A manual run defaults to a dry run (counts only, nothing mailed); the
      # Monday schedule has no inputs and always sends.
      - name: Send weekly commodity digest
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
        run: node scripts/notify-commodity-digest.js
