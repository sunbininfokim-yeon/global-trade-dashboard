name: Sync US Policy Reference Data

on:
  schedule:
    # 매월 1일 12:31 KST. 의원·상임위 기준정보는 일일 법안 수집과 분리한다.
    - cron: '31 3 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: us-policy-reference-monthly
  cancel-in-progress: false

jobs:
  sync-reference-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
      DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CONGRESS_REQUEST_INTERVAL_MS: '850'
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate reference-data pipeline
        run: |
          node --check scripts/sync-us-legislators.js
          node --check scripts/sync-committees.js
          node --check scripts/sync-committee-memberships.js
          node scripts/lib/committee-membership-source.test.js

      - name: Sync legislator, committee, and verified membership data
        run: node scripts/sync-policy-reference-data.js
