name: Weekly France Yield Forecast

# Refreshes the Eurostat NUTS 2 yield extract, rebuilds the training tables
# and models (Eurostat adds a season once a year, and the rebuild is cheap),
# and writes public/data/france_yield_forecast.json.
#
# On a pull request that touches france/ it runs the same steps and commits
# the outputs to the PR branch, because Eurostat and NASA POWER are only
# reachable from Actions.
on:
  schedule:
    # Fri 18:18 UTC -- clear of the other yield crons (15:22-17:56, 19:02).
    - cron: '18 18 * * 5'
  workflow_dispatch:
  pull_request:
    paths:
      - 'New for anti/scripts/yield_model/france/**'
      - '.github/workflows/france_yield_forecast.yml'

jobs:
  forecast:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || '' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy scikit-learn pytest

      - name: Refresh Eurostat regional yields
        working-directory: "New for anti/scripts/yield_model"
        run: python -m france.eurostat || echo "::warning::Eurostat refresh failed; keeping the committed extract"

      - name: Tests
        working-directory: "New for anti/scripts/yield_model"
        run: python -m pytest -q france

      - name: Rebuild training tables and models
        working-directory: "New for anti/scripts/yield_model"
        run: |
          python -m france.collect
          python -m france.train

      - name: Run forecast
        working-directory: "New for anti/scripts/yield_model"
        run: python -m france.run_forecast

      - name: Commit to the pull request branch
        if: github.event_name == 'pull_request'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "New for anti/public/data/france_yield_forecast.json" \
                  "New for anti/scripts/yield_model/france/data" \
                  "New for anti/scripts/yield_model/france/training" \
                  "New for anti/scripts/yield_model/france/models"
          git commit -m "chore: France forecast on the PR branch" || exit 0
          for i in 1 2 3; do
            git push origin "HEAD:$GITHUB_HEAD_REF" && exit 0
            echo "push rejected, rebasing and retrying ($i/3)"
            git pull --rebase --autostash origin "$GITHUB_HEAD_REF"
          done
          git push origin "HEAD:$GITHUB_HEAD_REF"

      # A separate step with a bare `git push`, so tools/ops/check_deploy_chain.py
      # sees that this workflow commits to main and deploy.yml must chain it.
      - name: Commit and Push Changes
        if: github.event_name != 'pull_request'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "New for anti/public/data/france_yield_forecast.json" \
                  "New for anti/scripts/yield_model/france/data" \
                  "New for anti/scripts/yield_model/france/training" \
                  "New for anti/scripts/yield_model/france/models"
          git commit -m "chore: weekly France yield forecast refresh" || exit 0
          for i in 1 2 3; do
            git push && exit 0
            echo "push rejected, rebasing onto latest main and retrying ($i/3)"
            git pull --rebase --autostash
          done
          git push
