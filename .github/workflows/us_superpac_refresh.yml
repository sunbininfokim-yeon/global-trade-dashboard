name: US Super PAC public disclosures
on:
  schedule:
    - cron: '25 8 * * *'
  workflow_dispatch:
    inputs:
      cycle:
        description: FEC two-year reporting cycle (even year)
        default: '2026'
        required: true
permissions:
  contents: write
  actions: write
concurrency:
  group: us-superpac-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate financial aggregation
        working-directory: New for anti/scripts/election_watch
        run: python -m unittest discover -s tests -p 'test_superpac*.py' -v
      - name: Collect complete reporting cycle
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY || secrets.DATA_GOV_API_KEY }}
          FEC_CYCLE: ${{ inputs.cycle || '2026' }}
        run: python 'New for anti/scripts/election_watch/build_superpac.py' --cycle "$FEC_CYCLE"
      - name: Publish successful snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'New for anti/public/data/usa_superpac' 'New for anti/public/data/usa_superpac_index_v1.json'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: refresh US Super PAC disclosures'
          git pull --rebase origin main
          git push origin HEAD:main
      # GITHUB_TOKEN pushes do not start the push-triggered deploy workflow.
      - name: Deploy published assets through existing workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
