name: Vietnam forecast regenerate (temporary)
# Branch-only; removed before the PR. Bump to re-run: 2
on:
  push:
    branches: [claude/vietnam-ndvi]
    paths: ['.github/workflows/vietnam_probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy scipy scikit-learn
      - name: Forecast
        working-directory: "New for anti/scripts/yield_model"
        run: python -m vietnam.run_forecast
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "New for anti/public/data/vietnam_yield_forecast.json"
          git commit -m "chore: Vietnam forecast with coffee" || exit 0
          git push
