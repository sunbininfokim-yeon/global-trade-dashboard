name: Deploy Mailing Worker
on:
  workflow_dispatch:
    inputs:
      send_enabled:
        description: 'Enable scheduled sending to subscribers (SQL migration and Resend domain must be ready)'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: deploy-mailing-worker
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/mailing
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm run types && npm run check
      - name: Deploy with server secrets and explicit send setting
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SEND_ENABLED: ${{ inputs.send_enabled }}
        run: |
          case "$SEND_ENABLED" in true|false) ;; *) exit 1 ;; esac
          secrets_file=$(mktemp)
          trap 'rm -f "$secrets_file"' EXIT
          node --input-type=module -e '
            import {writeFileSync} from "node:fs";
            const keys = ["SUPABASE_URL", "SUPABASE_SERVICE_ROLE_KEY", "RESEND_API_KEY"];
            if (keys.some(k => !process.env[k])) throw new Error("Missing mailing secret");
            writeFileSync(process.argv[1], JSON.stringify(Object.fromEntries(keys.map(k => [k, process.env[k]]))), {mode: 0o600});
          ' "$secrets_file"
          npx wrangler deploy --secrets-file "$secrets_file" --var "MAIL_SEND_ENABLED:$SEND_ENABLED"
