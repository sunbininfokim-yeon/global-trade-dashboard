name: Weekly Palm Oil Forecast (Malaysia, Thailand, Colombia, Nigeria)

# Indonesia has its own workflow. This refreshes the USDA PSD palm-oil slice
# for the other four producers, rebuilds their lagged-drought features from
# NASA POWER, re-scores the read-out, and writes the forecasts. Thailand's
# palm region is merged into thailand_yield_forecast.json, which the Thailand
# workflow (17:34) rewrites from the same PSD slice.
#
# On a pull request that touches palm_oil/ it runs the same steps and commits
# the outputs to the PR branch, because PSD and NASA POWER are only reachable
# from Actions.
on:
  schedule:
    # Fri 17:23 UTC -- before Thailand (17:34) and Indonesia (17:56).
    - cron: '23 17 * * 5'
  workflow_dispatch:
  pull_request:
    paths:
      - 'New for anti/scripts/yield_model/palm_oil/**'
      - '.github/workflows/palm_oil_forecast.yml'

jobs:
  forecast:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || '' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy scikit-learn pytest

      - name: Offline tests
        working-directory: "New for anti/scripts/yield_model"
        run: python -m pytest palm_oil -q

      - name: Refresh USDA PSD palm oil
        working-directory: "New for anti/scripts/yield_model"
        run: python -m palm_oil.psd || echo "::warning::PSD refresh failed; using the committed slice"

      - name: Build weather features
        # NASA POWER daily, no key. A failure keeps last week's features.
        working-directory: "New for anti/scripts/yield_model"
        run: python -m palm_oil.conditions build || echo "::warning::NASA POWER refresh failed; using committed features"

      - name: Re-score the weather read-out
        working-directory: "New for anti/scripts/yield_model"
        run: python -m palm_oil.conditions backtest

      - name: Run forecast
        working-directory: "New for anti/scripts/yield_model"
        run: python -m palm_oil.forecast

      - name: Commit and Push Changes
        env:
          BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          for f in "New for anti/scripts/yield_model/palm_oil/training" \
                   "New for anti/public/data/"{malaysia,colombia,nigeria,thailand}_yield_forecast.json; do
            [ -e "$f" ] && git add "$f"
          done
          git commit -m "chore: weekly palm oil forecast refresh" || exit 0
          for i in 1 2 3; do
            git push origin "HEAD:$BRANCH" && exit 0
            echo "push rejected, rebasing onto latest $BRANCH and retrying ($i/3)"
            git pull --rebase --autostash origin "$BRANCH"
          done
          git push origin "HEAD:$BRANCH"
