name: tmp PKS Korea customs probe
on:
  push:
    branches: [claude/pks-korea-imports]
    paths: ['tmpprobe/**', '.github/workflows/tmp_pks_probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tmpprobe/probe.py
        env:
          K: ${{ secrets.KOREA_CUSTOMS_SERVICE_KEY }}
