# TEMPORARY (removed before the PR): dump public ECOS CPI rows as an artifact.
name: tmp kr cpi probe
on:
  push:
    branches: [claude/kr-cpi-contrib]
    paths: [tmp_probe/**, .github/workflows/tmp_kr_cpi_probe.yml]
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tmp_probe/ecos_dump.py
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: ecos-cpi
          path: ecos_cpi_dump.json
