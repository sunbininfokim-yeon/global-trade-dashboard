name: Russia labels rebuild (temporary)

# Branch-only: refresh oblast labels from tochno.st, rebuild the training
# tables and models, commit them back to this branch for review. Removed
# before merge.
on:
  push:
    branches: ['claude/russia-labels']
    paths: ['.github/workflows/russia_labels_rebuild_tmp.yml']

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy scipy scikit-learn
      - name: Labels, collect, train
        working-directory: "New for anti/scripts/yield_model"
        run: |
          set -e
          python -m russia.tochno
          python -m russia.collect
          python -m russia.train 2>&1 | tee /tmp/train.log
          python -m russia.run_forecast
          mkdir -p russia/_rebuild_log && cp /tmp/train.log russia/_rebuild_log/train.log
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "New for anti/scripts/yield_model/russia/training" "New for anti/scripts/yield_model/russia/models" \
                  "New for anti/scripts/yield_model/russia/_rebuild_log" "New for anti/public/data/russia_yield_forecast.json"
          git commit -m "chore: rebuild Russia models on tochno.st labels" && git push
