name: tmp ukraine psd
on:
  push:
    branches: [claude/ukraine-stages]
    paths: [".github/workflows/tmp_ua_psd.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - run: pip install pandas
      - run: |
          mkdir -p probe
          python3 - <<'PY'
          import io, zipfile, urllib.request, pandas as pd
          out=[]
          for name,url in [("grains","https://apps.fas.usda.gov/psdonline/downloads/psd_grains_pulses_csv.zip"),("oilseeds","https://apps.fas.usda.gov/psdonline/downloads/psd_oilseeds_csv.zip")]:
              blob=urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"yield-model/1.0"}),timeout=600).read()
              z=zipfile.ZipFile(io.BytesIO(blob)); n=[x for x in z.namelist() if x.endswith(".csv")][0]
              df=pd.read_csv(z.open(n),encoding="latin-1",low_memory=False)
              df=df[(df.Country_Name=="Ukraine")&df.Commodity_Description.isin(["Wheat","Corn","Oilseed, Sunflowerseed"])&df.Attribute_Description.isin(["Production","Yield","Area Harvested","Exports"])]
              out.append(df[["Commodity_Description","Market_Year","Calendar_Year","Month","Attribute_Description","Unit_Description","Value"]])
          d=pd.concat(out); d.to_csv("probe/psd_ukraine.csv",index=False); print(d.Market_Year.max(), len(d))
          PY
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add probe; git commit -qm "probe psd"; git push
