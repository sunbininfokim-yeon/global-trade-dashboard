name: Natural gas storage daily

on:
  push:
    branches: [main]
    paths:
      - 'New for anti/scripts/gas_storage/**'
      - '.github/workflows/gas_storage_daily.yml'
  schedule:
    - cron: '35 0 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'New for anti/scripts/gas_storage/**'
      - 'New for anti/gas-storage.js'
      - '.github/workflows/gas_storage_daily.yml'

permissions:
  contents: read

concurrency:
  group: gas-storage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s 'New for anti/scripts/gas_storage/tests' -v
      - run: node --check 'New for anti/gas-storage.js'

  update:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect official inventories and benchmark
        id: collect
        continue-on-error: true
        env:
          GIE_API_KEY: ${{ secrets.GIE_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python 'New for anti/scripts/gas_storage/collect.py' --require-gie
      - name: Save result for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gas-storage-status
          path: New for anti/public/data/gas_storage_v1.json
          retention-days: 14
      - name: Persist inventory and source health
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f 'New for anti/public/data/gas_storage_v1.json'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'New for anti/public/data/gas_storage_v1.json'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: refresh natural gas inventories'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
      - name: Surface collection failures after persisting health
        if: steps.collect.outcome == 'failure'
        run: exit 1
