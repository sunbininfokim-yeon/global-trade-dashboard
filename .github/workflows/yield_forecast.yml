name: Weekly US Yield Forecast

on:
  schedule:
    # Mondays 09:00 UTC. NASA POWER lags real time by 2-3 days, so a weekly
    # cadence always picks up genuinely new observations rather than re-running
    # on the same data.
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  forecast:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn

      - name: Run forecast
        working-directory: "New for anti/scripts/yield_model"
        env:
          USDA_NASS_API_KEY: ${{ secrets.USDA_NASS_API_KEY }}
        run: |
          python run_forecast.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "New for anti/public/data/yield_forecast.json"
          git commit -m "chore: weekly US Corn Belt yield forecast refresh" || exit 0
          git push
