name: Comtrade probe

# Reads (and warms) the production /api/comtrade proxy: which annual year the
# map is on, fills the next years' cache so the cron can promote, and measures
# how much monthly bilateral data Comtrade returns. See tools/ops/comtrade_probe.py.
#
# Manual, plus a run whenever the probe itself changes on a claude/ branch so a
# change can be checked before it merges. It only issues GETs to the public
# site; the Comtrade key stays in the Worker.

on:
  workflow_dispatch:
    inputs:
      warm:
        description: "Fill next annual years' cache"
        type: boolean
        default: true
      monthly:
        description: "Probe monthly bilateral coverage"
        type: boolean
        default: true
  push:
    branches: ['claude/**']
    paths:
      - tools/ops/comtrade_probe.py
      - .github/workflows/comtrade_probe.yml

permissions:
  contents: read

concurrency:
  group: comtrade-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Probe production
        run: |
          args=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ "${{ inputs.warm }}" = "true" ] || args="$args --no-warm"
            [ "${{ inputs.monthly }}" = "true" ] || args="$args --no-monthly"
          fi
          python3 tools/ops/comtrade_probe.py $args
