name: Argentina NDVI (MODIS, weekly)

# In-season crop-condition channel for the Argentine yield models. The Bolsa
# de Cereales condition ratings sit behind a Cloudflare browser challenge, so
# the condition signal comes from MODIS MOD13Q1 via the keyless ORNL DAAC API.
on:
  schedule:
    # Thu 15:20 UTC -- a day before the Friday Argentina forecast, so the
    # forecast run always sees the latest composite. MOD13Q1 lands every 16
    # days with a ~2 week lag; a weekly check never misses one.
    - cron: '20 15 * * 4'
  # TEMP backfill trigger for the feature branch; removed before merge.
  push:
    branches: ['claude/argentina-condition']
    paths: ['.github/workflows/argentina_ndvi.yml', 'New for anti/scripts/yield_model/argentina/ndvi.py']
  workflow_dispatch:
    inputs:
      full:
        description: 'Rebuild the whole record from 2000'
        type: boolean
        default: false

jobs:
  ndvi:
    runs-on: ubuntu-latest
    timeout-minutes: 230
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy

      - name: Collect NDVI
        # Incremental: only composites missing from condition/ndvi_points.csv
        # are requested. The first run backfills 2000 onward (~2,400 calls).
        working-directory: "New for anti/scripts/yield_model"
        run: python -m argentina.ndvi ${{ inputs.full && '--full' || '' }}

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "New for anti/scripts/yield_model/argentina/condition"
          git commit -m "chore: Argentina MODIS NDVI refresh" || exit 0
          for i in 1 2 3; do
            git push && exit 0
            echo "push rejected, rebasing and retrying ($i/3)"
            git pull --rebase --autostash
          done
          git push
