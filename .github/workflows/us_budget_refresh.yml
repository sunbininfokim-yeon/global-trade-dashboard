name: Refresh US budget monthly actuals

# Preserve the name: deploy.yml already chains this collector.
on:
  schedule:
    - cron: '23 21 * * 1-5'
  pull_request:
    paths:
      - 'New for anti/scripts/us_budget/**'
      - 'New for anti/public/data/us_budget/**'
      - 'New for anti/policy-budget/**'
      - '.github/workflows/us_budget_refresh.yml'
  workflow_dispatch:
    inputs:
      verify_snapshot:
        description: 'Re-derive the reviewed MTS snapshot; publish nothing'
        type: boolean
        default: false
      dry_run:
        description: 'Collect and validate; publish nothing'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: us-budget-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      outcome: ${{ steps.collect.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install XLSX reader
        run: python -m pip install -r 'New for anti/scripts/us_budget/requirements.txt'
      - name: Regression tests
        working-directory: New for anti/scripts/us_budget
        run: |
          python -m unittest discover -v -p 'test_*.py'
          node --test us_budget_data.test.mjs budget_live.test.mjs
      - name: Verify parsing against the reviewed snapshot
        if: github.event_name == 'pull_request' || inputs.verify_snapshot == true
        working-directory: New for anti/scripts/us_budget
        run: python refresh_mts.py --verify-snapshot
      - name: Collect OMB annual tables and Treasury actuals
        id: collect
        continue-on-error: true
        run: python 'New for anti/scripts/us_budget/refresh_budget.py' --output-dir "$RUNNER_TEMP/us-budget"
      - name: Validate staged bundle against the page contract
        if: steps.collect.outcome == 'success'
        env:
          US_BUDGET_STAGED_DIR: ${{ runner.temp }}/us-budget
        run: node --test 'New for anti/scripts/us_budget/budget_live.test.mjs'
      - name: Save collection receipt and validated bundle
        if: always() && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: us-budget-validated
          path: |
            ${{ runner.temp }}/us-budget/budget_live_v1.json
            ${{ runner.temp }}/us-budget/collection_status_v1.json
          if-no-files-found: error
          retention-days: 7
      - name: Report result
        if: always()
        env:
          RESULT: ${{ steps.collect.outcome }}
        run: |
          echo "US budget collection: $RESULT. Monetary data publishes only after all validations pass." >> "$GITHUB_STEP_SUMMARY"
          if [ "$RESULT" = failure ]; then exit 1; fi

  publish:
    needs: collect
    # A branch or PR never receives production write permission.
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      inputs.dry_run != true && inputs.verify_snapshot != true &&
      (needs.collect.result == 'success' || needs.collect.outputs.outcome == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: us-budget-validated
          path: ${{ runner.temp }}/us-budget
      - name: Publish validated data or failure receipt
        env:
          COLLECTION_OUTCOME: ${{ needs.collect.outputs.outcome }}
        run: |
          python 'New for anti/scripts/us_budget/publish_budget.py' --staged-dir "$RUNNER_TEMP/us-budget" --outcome "$COLLECTION_OUTCOME"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'New for anti/public/data/us_budget/budget_live_v1.json' 'New for anti/public/data/us_budget/collection_status_v1.json'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh US budget data and collection receipt"
          for i in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            # Reapply the validated files to latest main; never text-merge JSON.
            git fetch origin main
            git switch --detach origin/main
            python 'New for anti/scripts/us_budget/publish_budget.py' --staged-dir "$RUNNER_TEMP/us-budget" --outcome "$COLLECTION_OUTCOME"
            git add 'New for anti/public/data/us_budget/budget_live_v1.json' 'New for anti/public/data/us_budget/collection_status_v1.json'
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "chore: refresh US budget data and collection receipt"
          done
          git push origin HEAD:main
