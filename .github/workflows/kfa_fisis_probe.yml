name: KFA FISIS probe (one-off)
on:
  pull_request:
    paths:
      - 'tools/ops/fisis_probe.py'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe
        env:
          FISIS_API_KEY: ${{ secrets.FISIS_API_KEY }}
        run: python -u tools/ops/fisis_probe.py
