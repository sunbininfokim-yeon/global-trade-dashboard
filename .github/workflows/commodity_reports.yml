name: Commodity Reports Intel

on:
  schedule:
    # Offset from official_reports (:20) and the news ticker so the three
    # feed-scraping jobs do not hit the same publishers in the same minute.
    - cron: '40 */4 * * *'
  workflow_dispatch:

jobs:
  update-commodity-reports:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests
        working-directory: New for anti/scripts/commodity_reports
        run: python -m unittest discover -s tests -v
      - name: Build
        working-directory: New for anti/scripts/commodity_reports
        # --print-stats lists every feed that failed, which is the only place a
        # publisher that moved or started returning 403 becomes visible.
        run: python build_reports.py build --print-stats
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "New for anti/public/data/commodity_reports_v1.json"
          git commit -m "chore: refresh commodity report intel" || exit 0
          # Non-fast-forward race: a bare push drops this refresh when another
          # scheduled job lands a commit on main first. Rebase and retry.
          for i in 1 2 3; do
            git push && exit 0
            echo "push rejected, rebasing onto latest main and retrying ($i/3)"
            git pull --rebase --autostash
          done
          git push
