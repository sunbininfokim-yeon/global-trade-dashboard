name: Monthly fertilizer prices

# World Bank Pink Sheet monthly urea / potash / DAP / TSP prices for the
# fertilizer trade views (scripts/fertilizer/prices.py). The sheet is
# published early each month.
#
# On a pull request touching the builder it runs the same refresh and commits
# the outputs to the PR branch (the World Bank is only reachable from Actions).
on:
  schedule:
    - cron: '40 2 6 * *'
    - cron: '40 2 16 * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'New for anti/scripts/fertilizer/**'
      - '.github/workflows/fertilizer_prices.yml'

jobs:
  refresh:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || '' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy openpyxl
      - name: Affordability tests
        working-directory: New for anti/scripts/fertilizer
        run: python3 -m unittest -v test_affordability test_korea_urea
      - name: Build fertilizer prices
        run: python3 "New for anti/scripts/fertilizer/prices.py"

      - name: Commit to the pull request branch
        if: github.event_name == 'pull_request'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "New for anti/scripts/fertilizer" \
                  "New for anti/public/data/fertilizer_prices_v1.json"
          git commit -m "chore: fertilizer prices on the PR branch" || exit 0
          git push origin "HEAD:$GITHUB_HEAD_REF"

      # A separate step with a bare `git push`, so tools/ops/check_deploy_chain.py
      # sees that this workflow commits to main and deploy.yml must chain it.
      - name: Commit and Push Changes
        if: github.event_name != 'pull_request'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "New for anti/scripts/fertilizer" \
                  "New for anti/public/data/fertilizer_prices_v1.json"
          git commit -m "chore: fertilizer prices refresh" || exit 0
          for i in 1 2 3; do
            git push && exit 0
            echo "push rejected, rebasing onto latest main and retrying ($i/3)"
            git pull --rebase --autostash
          done
          git push
