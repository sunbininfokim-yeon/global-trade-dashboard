name: tmp stage diag
on:
  push:
    branches: [claude/stage-diag]
    paths: ['.github/workflows/tmp_stage_diag.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request
          base = "https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/"
          for ds, q in [("agr_r_crops", "geo=FR21&geo=FR22&geo=FR24"), ("apro_cpshr_h", "geo=FR21"), ("apro_cpnhr_h", "geo=FR21")]:
              try:
                  d = json.load(urllib.request.urlopen(base + ds + "?" + q, timeout=120))
                  dims = {k: list(v["category"]["index"].keys())[:60] for k, v in d["dimension"].items()}
                  print("==", ds, d.get("label"))
                  for k, v in dims.items(): print(k, v)
                  print("n values", len(d.get("value", {})))
              except Exception as e:
                  print("==", ds, "ERR", e)
          PY
