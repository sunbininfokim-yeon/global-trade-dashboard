name: Probe 7-country yield forecasts in CI

# Temporary probe: runs each country's run_forecast on a clean runner to see
# whether it works without local caches or credentials. Commits nothing.
on:
  push:
    branches: ['claude/project-thread-v1m0jy']
    paths: ['.github/workflows/yield_7country_probe.yml']
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        country: [australia, indonesia, thailand, vietnam, south_africa, ethiopia, uganda]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy scikit-learn requests earthengine-api
      - name: Run forecast
        working-directory: "New for anti/scripts/yield_model"
        run: |
          start=$(date +%s)
          set +e
          python -m ${{ matrix.country }}.run_forecast 2>&1 | tee /tmp/run.log
          rc=${PIPESTATUS[0]}
          echo "exit=$rc elapsed=$(( $(date +%s) - start ))s" | tee -a /tmp/run.log
          git -C "$GITHUB_WORKSPACE" status --short | tee -a /tmp/run.log
          cp "../../public/data/${{ matrix.country }}_yield_forecast.json" /tmp/ 2>/dev/null
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-${{ matrix.country }}
          path: |
            /tmp/run.log
            /tmp/${{ matrix.country }}_yield_forecast.json
