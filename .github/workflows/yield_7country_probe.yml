name: Probe 7-country yield forecasts in CI

# Temporary probe: runs each country's run_forecast on a clean runner to see
# whether it works without local caches or credentials. Commits nothing.
on:
  push:
    branches: ['claude/project-thread-v1m0jy']
    paths: ['.github/workflows/yield_7country_probe.yml']
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        country: [australia, indonesia, thailand, vietnam, south_africa, ethiopia, uganda]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -q --upgrade pip
          pip install -q pandas numpy scipy scikit-learn requests earthengine-api
      - name: Run forecast
        working-directory: "New for anti/scripts/yield_model"
        run: |
          start=$(date +%s)
          set +e
          python -m ${{ matrix.country }}.run_forecast 2>&1 | tee /tmp/run.log
          rc=${PIPESTATUS[0]}
          echo "exit=$rc elapsed=$(( $(date +%s) - start ))s" | tee -a /tmp/run.log
          git -C "$GITHUB_WORKSPACE" status --short | tee -a /tmp/run.log
          cp "../../public/data/${{ matrix.country }}_yield_forecast.json" /tmp/ 2>/dev/null
          echo "::group::PROBE SUMMARY"
          echo "PROBE exit=$rc"
          tail -n 25 /tmp/run.log | sed 's/^/PROBE log| /'
          git -C "$GITHUB_WORKSPACE" show "HEAD:New for anti/public/data/${{ matrix.country }}_yield_forecast.json" > /tmp/old.json
          python - "${{ matrix.country }}" <<'PY'
          import json, sys
          c = sys.argv[1]
          old = json.load(open('/tmp/old.json'))
          try:
              new = json.load(open(f'../../public/data/{c}_yield_forecast.json'))
          except Exception as e:
              print('PROBE no new json', e); sys.exit()
          print('PROBE generated_at', old.get('generated_at'), '->', new.get('generated_at'))
          keys = ['point', 'weather_effect_pct', 'weather_through', 'forecast_available', 'season', 'target_year', 'harvest_year']
          def pick(r):
              out = {k: r.get(k) for k in keys if k in r}
              for k in ('prediction', 'forecast'):
                  if isinstance(r.get(k), dict):
                      out.update({f'{k}.{kk}': r[k].get(kk) for kk in keys if kk in r[k]})
              return out
          for name in sorted(set(old.get('regions', {})) | set(new.get('regions', {}))):
              print('PROBE', name, pick(old.get('regions', {}).get(name, {})), '->', pick(new.get('regions', {}).get(name, {})))
          print('PROBE skipped', new.get('skipped'))
          PY
          echo "::endgroup::"
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-${{ matrix.country }}
          path: |
            /tmp/run.log
            /tmp/${{ matrix.country }}_yield_forecast.json
