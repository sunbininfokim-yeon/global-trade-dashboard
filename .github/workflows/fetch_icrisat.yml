name: Fetch ICRISAT Data

on:
  workflow_dispatch: # 수동 실행 트리거
  schedule:
    # Sat 00:00 KST (Fri 15:00 UTC) — first of the weekend weekly-refresh batch,
    # spaced ~22min apart on off-the-hour minutes so GitHub's shared runner
    # queue (busiest at :00/:15/:30/:45) doesn't delay every job at once.
    - cron: '0 15 * * 5'

jobs:
  download-data:
    runs-on: ubuntu-latest
    # 이게 없어서 이 워크플로는 네 번 실행되어 네 번 모두 실패했다. 다운로드와
    # 커밋까지는 매번 통과하고 마지막 push 만 403 "Write access to repository
    # not granted" 로 죽었다. 저장소의 기본 GITHUB_TOKEN 이 읽기 전용이라,
    # push 하는 다른 21개 워크플로는 전부 이 선언을 갖고 있다.
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run ICRISAT Data Fetcher
        run: |
          python "New for anti/scripts/icrisat_fetcher.py"

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add "New for anti/public/data/icrisat_crop_production.json"
          # 변경사항이 있을 때만 커밋
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update ICRISAT crop data" && git push)
