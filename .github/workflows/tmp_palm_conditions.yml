name: TMP palm conditions branch run

# Indonesia had no scheduled refresh; its forecast JSON was last written by
# hand on 2026-08-03. Refreshes the USDA PSD palm-oil slice (monthly WASDE
# revisions) and rewrites the forecast with current weather.
on:
  push:
    branches: [claude/palm-weather-signal]
    paths: ['.github/workflows/tmp_palm_conditions.yml']

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy scikit-learn

      - name: Refresh USDA PSD palm oil
        working-directory: "New for anti/scripts/yield_model"
        run: python -m indonesia.palm_psd fetch || echo "::warning::PSD refresh failed; using the committed slice"

      - name: Refresh palm weather-condition backtest
        # Offline: re-scores past seasons from the committed feature table.
        working-directory: "New for anti/scripts/yield_model"
        run: python -m indonesia.palm_conditions backtest

      - name: Run forecast
        # No API keys: NASA POWER, Open-Meteo, NOAA CPC, USDA PSD are open.
        working-directory: "New for anti/scripts/yield_model"
        run: python -m indonesia.run_forecast

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "New for anti/public/data/indonesia_yield_forecast.json" \
                  "New for anti/scripts/yield_model/indonesia/training/psd_palm_indonesia.csv" \
                  "New for anti/scripts/yield_model/indonesia/training/palm_conditions_backtest.json"
          git commit -m "chore: regenerate Indonesia forecast with palm weather conditions" || exit 0
          git push origin HEAD:claude/palm-weather-signal
