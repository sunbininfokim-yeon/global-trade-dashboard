name: tmp india rice build
on:
  push:
    branches: [claude/india-rice]
    paths: [".github/workflows/tmp_india_rice.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas numpy scipy scikit-learn
      - name: build
        working-directory: "New for anti/scripts/yield_model"
        run: |
          python -m india.idp
          python - <<'PY'
          import pandas as pd
          from india import idp, icrisat
          from india.regions import EAST_RICE as c
          later = idp.region_yield(c.crop, c.selector)
          print("IDP rice:", None if later is None else later.to_string())
          try:
              ic = icrisat.region_yield(c.crop, c.selector) if hasattr(icrisat, "region_yield") else None
              print("ICRISAT rice tail:", None if ic is None else ic.tail(10).to_string())
          except Exception as e:
              print("icrisat err", e)
          PY
          python -m india.collect east_rice
          python -m india.train east_rice
          python -m india.run_forecast
      - name: commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "New for anti/public/data/india_yield_forecast.json" "New for anti/scripts/yield_model/india/data/idp_apy.csv" "New for anti/scripts/yield_model/india/training" "New for anti/scripts/yield_model/india/models"
          git commit -m "chore: build India east rice (temp)" || exit 0
          git push
