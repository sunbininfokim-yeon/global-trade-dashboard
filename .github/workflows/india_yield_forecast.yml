name: Weekly India Yield Forecast

on:
  schedule:
    # Sat 01:28 KST (Fri 16:28 UTC) — weekend batch, 22min after Argentina.
    # Previously this and the Argentina job were both '0 10 * * 1' (an actual
    # collision that could race the same main commit); now on distinct slots.
    - cron: '28 16 * * 5'
  workflow_dispatch:
    inputs:
      rebuild:
        description: >-
          Re-run collect + train even without a new label year. Off for the
          routine weekly refresh, which rebuilds on its own when India Data
          Portal publishes a season the training tables lack.
        type: boolean
        default: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy scikit-learn

      # ICRISAT's district series ends in 2019 and is vendored
      # (india/data/icrisat_apy.csv), so it is never re-fetched. Seasons after
      # it come from India Data Portal's DES/UPAg extracts (india/idp.py),
      # refreshed here every week; when they carry a label year the training
      # tables do not yet have, the tables and models are rebuilt. A failed
      # download keeps last week's extract and the routine forecast still runs.
      - name: Refresh India Data Portal statistics
        id: idp
        working-directory: "New for anti/scripts/yield_model"
        run: |
          python -m india.idp || echo "::warning::India Data Portal refresh failed; keeping the committed extract"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import sys
          import pandas as pd
          from india import idp
          from india.regions import ALL
          new = False
          for cfg in ALL:
              later = idp.region_yield(cfg.crop, cfg.selector)
              if later is None or later.empty:
                  continue
              t = pd.read_csv(f"india/training/{cfg.key}.csv").dropna(subset=["yield_kg_ha"])
              if int(later.year.max()) > int(t.year.max()):
                  print(f"{cfg.key}: IDP has {int(later.year.max())}, training ends {int(t.year.max())}", file=sys.stderr)
                  new = True
          print(f"new_season={'true' if new else 'false'}")
          PY

      - name: Rebuild training tables and models
        if: ${{ github.event.inputs.rebuild == 'true' || steps.idp.outputs.new_season == 'true' }}
        working-directory: "New for anti/scripts/yield_model"
        run: |
          python -m india.collect
          python -m india.train

      - name: Run forecast
        # No API keys: India Data Portal, NASA POWER, NOAA CPC and NOAA PSL are all open.
        working-directory: "New for anti/scripts/yield_model"
        run: |
          python -m india.run_forecast

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "New for anti/public/data/india_yield_forecast.json" \
                  "New for anti/scripts/yield_model/india/data/idp_apy.csv" \
                  "New for anti/scripts/yield_model/india/training" \
                  "New for anti/scripts/yield_model/india/models"
          git commit -m "chore: weekly India regional yield forecast refresh" || exit 0
          # Non-fast-forward race: a bare push drops this refresh when another
          # scheduled job lands a commit on main first. Rebase and retry.
          for i in 1 2 3; do
            git push && exit 0
            echo "push rejected, rebasing onto latest main and retrying ($i/3)"
            git pull --rebase --autostash
          done
          git push
