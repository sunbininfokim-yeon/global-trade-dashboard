name: Update Global Trade Live Data

on:
  schedule:
    # Run every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-data:
    runs-on: ubuntu-latest
    # Needed for the commit step below to push back to the repo.
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        # agrobr comes from PyPI; an earlier version of this workflow pointed at
        # a scratch/ directory that does not exist in the repo, so every run failed.
        run: |
          python -m pip install --upgrade pip
          pip install pandas httpx structlog duckdb pydantic lxml agrobr

      - name: Fetch Live Data
        env:
          AGROBR_USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
        run: |
          python "New for anti/scripts/fetch_live_data.py"

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "New for anti/public/data/live_override.json"
          git commit -m "chore: auto-update live data from USDA and Comex Stat" || exit 0
          git push
