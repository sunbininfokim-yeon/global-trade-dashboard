name: Update Global Trade Live Data

on:
  schedule:
    # Sat 04:24 KST (Fri 19:24 UTC) — last of the weekend batch, 22min after
    # FOMC/Beige Book. Was Sunday 00:00 UTC; moved into the same off-the-hour
    # weekend slot so it's not left racing separately at a popular minute.
    - cron: '24 19 * * 5'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-data:
    runs-on: ubuntu-latest
    # Needed for the commit step below to push back to the repo.
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        # agrobr comes from PyPI; an earlier version of this workflow pointed at
        # a scratch/ directory that does not exist in the repo, so every run failed.
        run: |
          python -m pip install --upgrade pip
          pip install pandas httpx structlog duckdb pydantic lxml agrobr

      - name: Fetch Live Data
        env:
          AGROBR_USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
        run: |
          python "New for anti/scripts/fetch_live_data.py"

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "New for anti/public/data/live_override.json"
          git commit -m "chore: auto-update live data from USDA and Comex Stat" || exit 0
          # Non-fast-forward race: a bare push drops this refresh when another
          # scheduled job lands a commit on main first. Rebase and retry.
          for i in 1 2 3; do
            git push && exit 0
            echo "push rejected, rebasing onto latest main and retrying ($i/3)"
            git pull --rebase --autostash
          done
          git push
